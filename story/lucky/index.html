<style>
:root{--bg:#F8F4EC;--paper:#FFFDF8;--navy:#1F3A5F;--sea:#14527A;--deep:#0B2236;--terra:#C97B5B;--ink:#2C2825;--line:#E3DCCE;--mute:#6E675E;--soft:#EEE7D9;
--serif:"Gowun Batang","Noto Serif KR",serif;--sans:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font:400 1.02rem/1.85 var(--sans);background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
a{color:inherit} img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.35}
.wrap{width:min(1080px,100% - 2rem);margin-inline:auto}
.narrow{width:min(720px,100% - 2rem);margin-inline:auto}
nav{position:sticky;top:0;z-index:20;background:rgba(248,244,236,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.navin{height:58px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:2px;color:var(--navy);text-decoration:none}
.back{font-size:14px;text-decoration:none;color:var(--mute)} .back:hover{color:var(--terra)}
.hero{position:relative;isolation:isolate;min-height:min(82svh,760px);display:flex;align-items:flex-end;color:#F4F8FB;background:var(--deep);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:15% 50%;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,20,32,.1) 0%,rgba(6,20,32,.08) 40%,rgba(6,20,32,.85) 100%)}
.hero .wrap{padding:6rem 0 3rem}
.eyebrow{font-size:13px;letter-spacing:.14em;color:#9FD3E8;margin-bottom:.6rem}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem);margin-bottom:1rem}
.hero p{max-width:640px;font-size:1.05rem;color:#E3EEF4}
section{padding:3.6rem 0}
.sec-dark{background:var(--deep);color:#E7F0F5}
.kicker{font-size:12px;letter-spacing:.16em;color:var(--terra);margin-bottom:.4rem}
.sec-dark .kicker{color:#9FD3E8}
h2{font-size:clamp(1.5rem,3.6vw,2.1rem);margin-bottom:1.1rem}
p+p{margin-top:1rem}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcap{margin-top:.9rem;font-size:.92rem;color:#AFC4D1}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:2rem}
.fact{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:1.1rem 1rem}
.fact b{display:block;font-family:var(--serif);font-size:1.7rem;color:#fff;line-height:1.2}
.fact span{font-size:.88rem;color:#B9CCD8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:1.6rem 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:1.6rem 0}
figure img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px}
figcaption{font-size:.85rem;color:var(--mute);margin-top:.45rem;line-height:1.55}
.quote{border-left:3px solid var(--terra);padding:.2rem 0 .2rem 1.1rem;margin:1.6rem 0;font-family:var(--serif);font-size:1.12rem;line-height:1.75}
.quote cite{display:block;font-family:var(--sans);font-style:normal;font-size:.85rem;color:var(--mute);margin-top:.4rem}
.tl{list-style:none;margin-top:1.4rem;border-left:2px solid var(--line);padding-left:1.4rem}
.tl li{position:relative;padding-bottom:1.3rem}
.tl li::before{content:"";position:absolute;left:calc(-1.4rem - 7px);top:.55rem;width:12px;height:12px;border-radius:50%;background:var(--sea);border:2px solid var(--bg)}
.tl li.now::before{background:var(--terra)}
.tl time{display:block;font-size:.85rem;font-weight:500;color:var(--sea)}
.inj{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:1.4rem}
.inj div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1rem}
.inj b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--navy);margin-bottom:.3rem}
.inj span{font-size:.92rem;color:var(--mute);line-height:1.6;display:block}
.vet{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:1.6rem}
.vet img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:30% 30%;border-radius:10px}
.note{font-size:.85rem;color:var(--mute)}
.src{list-style:none;font-size:.9rem} .src li{padding:.35rem 0;border-bottom:1px solid var(--line)}
.src a{text-decoration:none;color:var(--navy)} .src a:hover{color:var(--terra)}
.breath{position:relative;margin:0} .bcap{position:absolute;left:0;right:0;bottom:0;padding:3rem 0 1.4rem;background:linear-gradient(180deg,rgba(6,20,32,0),rgba(6,20,32,.85));color:#E7F0F5;margin:0}
footer{padding:2.4rem 0 3rem;font-size:.88rem;color:var(--mute);text-align:center}
@media (max-width:760px){.bcap{position:static;background:var(--deep);padding:1.2rem 0 1.6rem}.facts{grid-template-columns:repeat(2,1fr)}.two,.three,.inj{grid-template-columns:1fr}.vet{grid-template-columns:1fr}.vet img{aspect-ratio:16/10}section{padding:2.6rem 0}}
.gate{min-height:70svh;display:flex;align-items:center;background:var(--deep);color:#E7F0F5} .gate .kicker{color:#9FD3E8}
#pwf{display:flex;gap:8px;max-width:380px} #pwf input{flex:1;font:500 1.05rem var(--sans);padding:.7em .9em;border:1px solid #3B5870;border-radius:8px;background:#0F2C44;color:#fff}
#pwf button{font:600 1rem var(--sans);padding:.7em 1.3em;border:0;border-radius:8px;background:var(--terra);color:#fff;cursor:pointer}
</style></head>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(ENC.s),iterations:ENC.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(ENC.i)},k,u8(ENC.c)));
  const m=document.getElementById("locked"); m.insertAdjacentHTML("afterend",html); m.remove();
  try{sessionStorage.setItem("lucky-pw",pw)}catch(e){}
}
document.getElementById("pwf").addEventListener("submit",async e=>{e.preventDefault();
  const msg=document.getElementById("pwmsg"); msg.textContent="여는 중…";
  try{await unlock(document.getElementById("pw").value.trim())}catch(err){msg.textContent="비밀번호가 맞지 않아요."} });
(async()=>{let p=null;try{p=sessionStorage.getItem("lucky-pw")}catch(e){} if(p){try{await unlock(p)}catch(e){}}})();
