const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(ENC.s),iterations:ENC.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(ENC.i)},k,u8(ENC.c)));
  const m=document.getElementById("locked"); m.insertAdjacentHTML("afterend",html); m.remove(); if(window.initPage)initPage();
  try{sessionStorage.setItem("lucky-pw",pw)}catch(e){}
}

(async()=>{let p=null;try{p=sessionStorage.getItem("lucky-pw")}catch(e){} if(p){try{await unlock(p)}catch(e){}}})();

<script>// 럭키 페이지 — 카드뉴스 넘기기 + 드라이브 영상·사진 골라 받기
window.initPage = function () {
  const $ = s => document.querySelector(s);
  // 카드뉴스
  const row = $("#cnrow");
  document.querySelectorAll(".cnnav button").forEach(b => b.onclick = () => row.scrollBy({ left: +b.dataset.d * (row.querySelector(".cn").offsetWidth + 16), behavior: "smooth" }));
  // 갤러리
  const el = $("#gData"); if (!el) return;
  const FILES = JSON.parse(el.textContent);
  const TOP = { "0_완성영상": "완성 영상", "1_방류하루전_20261014_아쿠아플라넷제주": "10월 14일 · 방류 하루 전", "2_방류당일_20261015_광치기해변": "10월 15일 · 방류 당일" };
  const tops = Object.keys(TOP).filter(t => FILES.some(f => f.folder.split("/")[0] === t));
  const thumb = (f, w) => `https://drive.google.com/thumbnail?id=${f.id}&sz=w${w}`;
  const photoUrl = f => `https://lh3.googleusercontent.com/d/${f.id}=s0`;
  const videoDl = f => `https://drive.usercontent.google.com/download?id=${f.id}&export=download`;
  const nice = n => { // 20261015_105550_광치기해변-모래밭_럭키가기어서바다로_360카메라.mp4 → 제목/부제
    const b = n.replace(/\.(mp4|jpg)$/i, "").split("_");
    if (/^\d{8}$/.test(b[0]) && b.length >= 4) {
      const t = b[1].slice(0, 2) + ":" + b[1].slice(2, 4);
      return { t: b.slice(3, b.length - 1).join(" ").replace(/-/g, " · ") || b[2], s: `${t} · ${b[2].replace(/-/g, " · ")} · ${b[b.length - 1]}` };
    }
    return { t: b.join(" "), s: "" };
  };
  const mmss = d => d ? `${Math.floor(d / 60)}:${String(d % 60).padStart(2, "0")}` : "";
  const st = { top: tops[0], sub: "", sel: new Map() };
  function subs() { return [...new Set(FILES.filter(f => f.folder.split("/")[0] === st.top).map(f => f.folder.split("/").slice(1).join("/")))].sort((a, b) => (a.startsWith("영상") ? 0 : 1) - (b.startsWith("영상") ? 0 : 1) || a.localeCompare(b, "ko")); }
  function list() { return FILES.slice().sort((a, b) => (a.v ? 0 : 1) - (b.v ? 0 : 1) || a.folder.localeCompare(b.folder, "ko") || a.name.localeCompare(b.name)).filter(f => f.folder.split("/")[0] === st.top && (!st.sub || f.folder.split("/").slice(1).join("/") === st.sub)); }
  function render() {
    $("#gTabs").innerHTML = tops.map(t => `<button type="button" data-t="${t}" aria-pressed="${t === st.top}">${TOP[t]}</button>`).join("");
    const ss = subs().filter(Boolean);
    const lab = s => s.replace(/^사진_FHD\/?/, "사진 · ").replace(/^영상_FHD\/?/, "영상 · ").replace(/_/g, " ").replace(/ · $/, "");
    $("#gChips").innerHTML = (ss.length ? [`<button type="button" data-s="" aria-pressed="${!st.sub}">전체</button>`] : []).concat(ss.map(s => `<button type="button" data-s="${s}" aria-pressed="${s === st.sub}">${lab(s)}</button>`)).join("");
    const L = list();
    $("#gGrid").innerHTML = L.map(f => { const n = nice(f.name); return `<div class="gi${st.sel.has(f.id) ? " sel" : ""}" data-id="${f.id}">
      <input class="ck" type="checkbox" aria-label="고르기" ${st.sel.has(f.id) ? "checked" : ""}>
      <button type="button" class="th" aria-label="크게 보기"><img src="${thumb(f, 480)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity=0">${f.v ? `<span class="pl">▶</span><span class="dur">${mmss(f.dur)}</span>` : ""}</button>
      <div class="gb"><b>${n.t}</b><span>${n.s}</span><span>${f.mb ? f.mb + "MB" : ""}</span><button type="button" class="one">받기</button></div></div>`; }).join("") || `<p class="note">아직 올라가는 중입니다.</p>`;
    $("#gAll").checked = L.length && L.every(f => st.sel.has(f.id));
    $("#gFolder").href = "https://drive.google.com/drive/folders/" + (document.getElementById("gData").dataset.root || "");
    bar();
  }
  function bar() { const n = st.sel.size; $("#gBar").hidden = !n; const v = [...st.sel.values()].filter(f => f.v).length; $("#gCount").textContent = `${n}개 고름 (영상 ${v} · 사진 ${n - v})`; }
  const byId = Object.fromEntries(FILES.map(f => [f.id, f]));
  $("#gTabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.top = b.dataset.t; st.sub = ""; render(); };
  $("#gChips").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.sub = b.dataset.s; render(); };
  $("#gAll").onchange = e => { list().forEach(f => e.target.checked ? st.sel.set(f.id, f) : st.sel.delete(f.id)); render(); };
  $("#gGrid").onclick = e => {
    const card = e.target.closest(".gi"); if (!card) return; const f = byId[card.dataset.id];
    if (e.target.classList.contains("ck")) { e.target.checked ? st.sel.set(f.id, f) : st.sel.delete(f.id); card.classList.toggle("sel", e.target.checked); bar(); return; }
    if (e.target.closest(".one")) { getOne(f); return; }
    if (e.target.closest(".th")) view(f);
  };
  // 크게 보기
  let cur = null;
  function view(f) { cur = f; $("#gViewBody").innerHTML = f.v ? `<iframe src="https://drive.google.com/file/d/${f.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>` : `<img src="${thumb(f, 1920)}" alt="" referrerpolicy="no-referrer">`;
    $("#gViewT").textContent = nice(f.name).t; $("#gView").showModal(); }
  $("#gViewX").onclick = () => { $("#gView").close(); $("#gViewBody").innerHTML = ""; };
  $("#gViewDl").onclick = () => cur && getOne(cur);
  // 받기
  function save(blob, name) { const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); }
  async function getOne(f) {
    if (f.v) { window.open(videoDl(f), "_blank", "noopener"); return; }
    try { const r = await fetch(photoUrl(f), { referrerPolicy: "no-referrer" }); if (!r.ok) throw 0; save(await r.blob(), f.name); }
    catch (e) { window.open(photoUrl(f), "_blank", "noopener"); }
  }
  $("#gClear").onclick = () => { st.sel.clear(); render(); };
  $("#gClose").onclick = () => $("#gDlg").close();
  $("#gGet").onclick = () => {
    const S = [...st.sel.values()], V = S.filter(f => f.v), P = S.filter(f => !f.v);
    $("#gDlgT").textContent = `고른 ${S.length}개 받기`;
    $("#gDlgS").textContent = (P.length ? `사진 ${P.length}장은 ‘사진 ZIP으로 받기’를 누르면 파일 하나로 받습니다. ` : "") +
      (V.length ? `영상 ${V.length}개는 용량이 커서 하나씩 받습니다 — 아래 이름을 차례로 누르면 구글 드라이브 받기 창이 열립니다(큰 파일은 ‘무시하고 다운로드’를 한 번 더 누르세요).` : "");
    $("#gZip").hidden = !P.length; $("#gProg").hidden = true; $("#gMsg").textContent = "";
    $("#gList").innerHTML = V.map(f => `<a href="${videoDl(f)}" target="_blank" rel="noopener" data-id="${f.id}"><span>▶ ${nice(f.name).t} <small>${nice(f.name).s}</small></span><span>${f.mb}MB ⬇</span></a>`).join("");
    $("#gDlg").showModal();
  };
  $("#gList").onclick = e => { const a = e.target.closest("a"); if (a) setTimeout(() => a.classList.add("done"), 300); };
  let Z = null; const loadZip = () => Z || (Z = new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload = () => ok(window.JSZip); s.onerror = no; document.head.appendChild(s); }));
  $("#gZip").onclick = async () => {
    const P = [...st.sel.values()].filter(f => !f.v); $("#gZip").disabled = true; $("#gProg").hidden = false;
    try {
      const J = await loadZip(), z = new J(); let done = 0, k = 0, bad = 0;
      async function w() { while (k < P.length) { const f = P[k++]; try { const r = await fetch(photoUrl(f), { referrerPolicy: "no-referrer" }); if (!r.ok) throw 0; z.file(f.name, await r.blob()); } catch (e) { bad++; } done++; $("#gProg i").style.width = (100 * done / P.length) + "%"; $("#gMsg").textContent = `사진을 모으는 중… ${done} / ${P.length}`; } }
      await Promise.all([1, 2, 3, 4].map(w));
      $("#gMsg").textContent = "ZIP 파일을 만드는 중…";
      save(await z.generateAsync({ type: "blob", compression: "STORE" }), `럭키_사진_${P.length}장.zip`);
      $("#gMsg").textContent = bad ? `받았습니다. ${bad}장은 받지 못했어요 — 하나씩 ‘받기’로 받아 주세요.` : "받았습니다.";
    } catch (e) { $("#gMsg").textContent = "ZIP을 만들지 못했어요. 사진을 하나씩 받아 주세요."; }
    $("#gZip").disabled = false;
  };
  render();
};

if(document.getElementById('gData'))initPage();</script>
