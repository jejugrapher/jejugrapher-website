<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리자 — JEJUGRAPHER</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--card:#FFFDF8;--ink:#1B2430;--mute:#7A7267;--line:#E3DCCE;--navy:#1F3A5F;--terra:#C97B5B;--ok:#2E7D5B;--warn:#B3452F}
*{margin:0;padding:0;box-sizing:border-box}
body{font:400 16px/1.7 "IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:14px 0;border-bottom:1px solid var(--line)}
header a{color:var(--mute);text-decoration:none;font-size:.9rem}
h1{font-family:"Gowun Batang",serif;font-size:1.3rem;letter-spacing:.04em}
.gate{max-width:380px;margin:12vh auto;text-align:center}
.gate p{color:var(--mute);font-size:.94rem;margin:.6rem 0 1.4rem}
input,button{font:inherit}
input[type=password],input[type=text]{width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:9px;background:#fff}
.btn{padding:.55rem 1rem;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:8px;margin:18px 0}
.tabs button{flex:1;padding:.6rem;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.meta{display:flex;flex-wrap:wrap;gap:.5rem 1rem;font-size:.82rem;color:var(--mute);margin-bottom:.5rem}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;font-size:.78rem}
.tag.lock{border-color:var(--terra);color:var(--terra)}
.msg{white-space:pre-wrap;font-size:.95rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.row .t{font-size:.95rem}
.row .p{font-size:.8rem;color:var(--mute);font-family:ui-monospace,monospace}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.state{font-size:.78rem;padding:.1rem .55rem;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.state.hid{border-color:var(--terra);color:var(--terra)}
.state.down{border-color:var(--warn);color:var(--warn)}
#say{position:sticky;bottom:0;padding:.7rem 0;color:var(--mute);font-size:.9rem;background:linear-gradient(transparent,var(--bg) 40%)}
.hint{color:var(--mute);font-size:.86rem;margin:.2rem 0 1rem}
.rep{margin-top:.8rem;border-top:1px solid var(--line);padding-top:.7rem}
.rep summary{cursor:pointer;color:var(--navy);font-size:.9rem;font-weight:500;list-style:none}
.rep summary::-webkit-details-marker{display:none}
.rep summary::before{content:"✎ ";color:var(--terra)}
.rep .f{display:flex;gap:8px;flex-wrap:wrap;margin-top:.7rem;align-items:center}
.rep select,.rep input[type=text]{padding:.45rem .6rem;border:1px solid var(--line);border-radius:8px;background:#fff}
.rep input[type=text]{flex:1;min-width:160px}
.rep textarea{width:100%;min-height:110px;margin-top:.7rem;padding:.6rem .7rem;border:1px solid var(--line);
  border-radius:9px;background:#fff;font:inherit;resize:vertical}
.rep label{font-size:.88rem;color:var(--mute);display:flex;align-items:center;gap:.35rem}
.done{background:var(--bg);border-left:3px solid var(--ok);padding:.5rem .7rem;margin-top:.6rem;
  font-size:.9rem;white-space:pre-wrap;color:var(--ink)}
.done b{color:var(--ok);font-weight:500}
</style></head><body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>관리자</h1>
    <p>비밀번호를 넣어 주세요.</p>
    <form id="gf" autocomplete="off">
      <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" required>
      <button class="btn pri" style="width:100%;margin-top:.7rem" type="submit">들어가기</button>
    </form>
    <p id="gerr" role="status" style="min-height:1.4em;color:var(--warn)"></p>
  </div>

  <div id="app" hidden>
    <header>
      <h1>관리자</h1>
      <div><a href="/">← 홈페이지</a> &nbsp; <button class="btn ghost" id="lock">잠그기</button></div>
    </header>
    <div class="tabs">
      <button id="t1" class="on">문의</button>
      <button id="t2">페이지 공개 관리</button>
    </div>

    <section id="p1">
      <p class="hint">비밀글 내용까지 모두 보입니다. 연락처가 있으면 함께 나옵니다.</p>
      <div id="asks">불러오는 중…</div>
    </section>

    <section id="p2" hidden>
      <p class="hint">
        <b>가리기</b>는 몇 초 안에 화면에서 사라집니다. 파일은 서버에 남아 있어, 주소를 아는 사람은 볼 수 있습니다.<br>
        <b>내리기</b>는 깃허브에서 실제로 페이지를 바꿉니다. 1~2분 걸리고, 사진 파일은 남습니다.
      </p>
      <div id="pages"></div>
      <div class="card">
        <div class="row"><span class="t">목록에 없는 주소</span></div>
        <div style="display:flex;gap:8px;margin-top:.6rem">
          <input id="custom" type="text" placeholder="예: story/lucky/">
          <button class="btn" data-act="hide" data-custom="1">가리기</button>
          <button class="btn" data-act="show" data-custom="1">보이기</button>
        </div>
      </div>
    </section>
    <div id="say"></div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwYW8zN_7UyGnbeYpf3A5hSeSp4GVTc3N3Rj3c28WgnOiAZHVDuovvn4WvN5zHE6_WV/exec";
const PAGES = [{"path": "eco/pilot/", "title": "2026 제주 생태관광주간 · 체험 평가단 시범프로그램"}, {"path": "spatial/", "title": "JEJUGRAPHER — 공간 데이터 풀스택 스튜디오"}, {"path": "spatial/whanhae-wall/", "title": "별도환해장성 디지털 트윈 — 3D 측정 · 가우시안 스플래팅 · 식생 분석"}, {"path": "spatial/whanhae-wall/report/", "title": "별도환해장성 드론 식생 분석 — 환해장성에 번지는 식물을 멀티스펙트럴로 재다"}, {"path": "story/chorok-eco/", "title": "구좌 아이들이 만든 초록별 환경놀이터 — 준비부터 하루까지"}, {"path": "story/jeju-cave-spring/", "title": "땅 아래 물길 — 제주의 어느 신비한 동굴"}, {"path": "story/lucky/", "title": "럭키, 자연으로 — 붉은바다거북 럭키의 7년과 귀환"}];
let KEY = null;

const $ = s => document.querySelector(s);
const say = t => { $('#say').textContent = t || ''; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function call(mode, extra) {
  const u = new URL(API);
  u.searchParams.set('mode', mode);
  if (KEY) u.searchParams.set('key', KEY);
  Object.entries(extra || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString(), { redirect: 'follow' });
  return r.json();
}

/* ── 탭 ── */
function setTab(n) {
  $('#t1').classList.toggle('on', n === 1);
  $('#t2').classList.toggle('on', n === 2);
  $('#p1').hidden = n !== 1;
  $('#p2').hidden = n !== 2;
}
$('#t1').addEventListener('click', () => setTab(1));
$('#t2').addEventListener('click', () => setTab(2));

/* ── 들어가기 ── */
$('#gf').addEventListener('submit', async e => {
  e.preventDefault();
  $('#gerr').textContent = '확인 중…';
  KEY = $('#pw').value;
  try {
    const d = await call('admin_state');
    if (!d.ok) { KEY = null; $('#gerr').textContent = '비밀번호가 맞지 않습니다.'; return; }
    try { sessionStorage.setItem('jg-admin', KEY); } catch (e) {}
    enter();
  } catch (err) {
    KEY = null;
    $('#gerr').textContent = '서버에 닿지 못했습니다. Apps Script 설치·배포를 확인해 주세요.';
  }
});
$('#lock').addEventListener('click', () => {
  KEY = null; try { sessionStorage.removeItem('jg-admin'); } catch (e) {}
  location.reload();
});

function enter() {
  $('#gate').hidden = true; $('#app').hidden = false;
  loadAsks(); loadPages();
}

/* ── 문의 ── */
async function loadAsks() {
  try {
    const d = await call('admin_list');
    if (!d.ok) { $('#asks').textContent = '불러오지 못했습니다.'; return; }
    if (!d.items.length) { $('#asks').textContent = '아직 문의가 없습니다.'; return; }
    $('#asks').innerHTML = d.items.map(it => `
      <div class="card">
        <div class="meta">
          <span>${esc(new Date(it.at).toLocaleString('ko-KR'))}</span>
          ${it.kind ? `<span class="tag">${esc(it.kind)}</span>` : ''}
          ${it.locked ? '<span class="tag lock">비밀글</span>' : ''}
          ${it.status ? `<span class="tag">${esc(it.status)}</span>` : ''}
        </div>
        <div style="font-weight:500">${esc(it.name) || '(이름 없음)'}
          ${it.contact ? `<span style="color:var(--mute);font-weight:400"> · ${esc(it.contact)}</span>` : ''}</div>
        <div class="msg" style="margin-top:.5rem">${esc(it.message)}</div>
        ${it.reply ? `<div class="done"><b>보낸 답변</b>
${esc(it.reply)}</div>` : ''}
        ${replyBox(it)}
      </div>`).join('');
  } catch (e) { $('#asks').textContent = '서버에 닿지 못했습니다.'; }
}

/* ── 답변하기 ── */
const isMail = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(s || '').trim());

function replyBox(it) {
  const mail = isMail(it.contact);
  return `<details class="rep" data-row="${it.row}" data-to="${esc(it.contact)}">
    <summary>답변하기</summary>
    <div class="f">
      <select data-f="status">
        ${['접수', '답변완료', '보류', '종결'].map(v =>
          `<option${v === (it.status || '접수') ? ' selected' : ''}>${v}</option>`).join('')}
      </select>
      <input type="text" data-f="memo" placeholder="내부 메모 (상대에게 안 보입니다)" value="${esc(it.memo)}">
    </div>
    <textarea data-f="reply" placeholder="${mail ? '답변 내용 — 메일로 그대로 갑니다' : '답변 내용 (기록만 됩니다)'}">${esc(it.reply)}</textarea>
    <div class="f">
      ${mail
        ? `<label><input type="checkbox" data-f="send" checked> ${esc(it.contact)} 로 메일 보내기</label>`
        : `<label>연락처가 메일이 아니라 기록만 됩니다 — ${esc(it.contact) || '연락처 없음'}</label>`}
      <button class="btn pri" data-reply="1" style="margin-left:auto">저장</button>
    </div>
  </details>`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-reply]');
  if (!b) return;
  const box = b.closest('.rep');
  const g = f => { const el = box.querySelector(`[data-f="${f}"]`); return el ? el.value : ''; };
  const sendEl = box.querySelector('[data-f="send"]');
  const reply = g('reply').trim();
  if (reply.length > 1500) { say('답변이 너무 깁니다. 1500자 안으로 줄여 주세요.'); return; }
  if (sendEl && sendEl.checked && !reply) { say('보낼 내용이 비어 있습니다.'); return; }
  b.disabled = true; say('저장하는 중…');
  try {
    const d = await call('ask_reply', {
      row: box.dataset.row, status: g('status'), memo: g('memo'),
      reply: reply, send: sendEl && sendEl.checked ? '1' : '0', to: box.dataset.to
    });
    say(d.ok ? ('저장했습니다' + (d.sent ? ' · 메일 ' + d.sent : '')) : ('실패: ' + (d.why || '알 수 없음')));
    if (d.ok) loadAsks();
  } catch (err) { say('서버에 닿지 못했습니다.'); }
  b.disabled = false;
});

/* ── 페이지 공개 관리 ── */
let STATE = {};
async function loadPages() {
  try {
    const d = await call('admin_state');
    STATE = {};
    (d.items || []).forEach(r => { STATE[r.path.replace(/^\/+/, '')] = r; });
  } catch (e) {}
  $('#pages').innerHTML = PAGES.map(p => {
    const s = STATE[p.path] || {};
    return `<div class="card"><div class="row">
      <div><div class="t">${esc(p.title)}
        ${s.hidden ? '<span class="state hid">가려짐</span>' : ''}
        ${s.down ? '<span class="state down">내려짐</span>' : ''}</div>
        <div class="p">/${esc(p.path)}</div></div>
      <div class="acts">
        <button class="btn" data-act="${s.hidden ? 'show' : 'hide'}" data-path="${esc(p.path)}">${s.hidden ? '다시 보이기' : '가리기'}</button>
        <button class="btn ${s.down ? '' : 'warn'}" data-act="${s.down ? 'republish' : 'unpublish'}" data-path="${esc(p.path)}">${s.down ? '되돌리기' : '내리기'}</button>
      </div></div></div>`;
  }).join('');
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  const path = b.dataset.custom ? $('#custom').value.trim().replace(/^\/+/, '') : b.dataset.path;
  if (!path) { say('주소를 적어 주세요.'); return; }
  const names = { hide: '가리기', show: '다시 보이기', unpublish: '내리기', republish: '되돌리기' };
  if (act === 'unpublish' && !confirm(`/${path} 을(를) 깃허브에서 실제로 내립니다.\n1~2분 뒤 반영됩니다. 진행할까요?`)) return;
  b.disabled = true; say(`${names[act]} 하는 중…`);
  try {
    const d = await call(act, { path });
    say(d.ok ? `${names[act]} 했습니다 — /${path}` : `실패: ${d.why || '알 수 없음'}`);
  } catch (err) { say('서버에 닿지 못했습니다.'); }
  b.disabled = false;
  loadPages();
});

/* 새로고침해도 다시 묻지 않게 */
try { const k = sessionStorage.getItem('jg-admin'); if (k) { KEY = k; enter(); } } catch (e) {}
</script>
</body></html>
