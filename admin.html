<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의 관리 — JEJUGRAPHER</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F4EC;--navy:#1F3A5F;--terra:#C97B5B;--ink:#2C2825;--line:#E3DCCE}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
h1{font-family:'Gowun Batang',serif;color:var(--navy)}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;background:rgba(248,244,236,.94);border-bottom:1px solid var(--line);z-index:100}
.navin{max-width:1180px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Gowun Batang',serif;font-weight:700;font-size:19px;letter-spacing:2px;color:var(--navy)}
.back{font-size:14px;color:var(--terra)}
.wrap{max-width:860px;margin:0 auto;padding:140px 24px 120px}
h1{font-size:28px;margin-bottom:8px}
.lead{font-size:14px;color:#8d8577;margin-bottom:36px}
.tabs{display:flex;gap:10px;margin-bottom:26px}
.tab{border:1px solid var(--navy);color:var(--navy);padding:8px 18px;font-size:13.5px;cursor:pointer;background:transparent}
.tab.on{background:var(--navy);color:#fff}
.card{background:#fff;border:1px solid var(--line);padding:24px 26px;margin-bottom:16px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ct{font-size:16px;font-weight:500;color:var(--navy)}
.cmeta{font-size:12.5px;color:#8d8577;margin-top:4px}
.state{font-size:11.5px;padding:2px 10px;white-space:nowrap}
.state.open{color:var(--terra);border:1px solid var(--terra)}
.state.closed{color:#8d8577;border:1px solid var(--line)}
.cbody{font-size:14px;color:#5a544c;margin-top:14px;white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:14px}
.clink{display:inline-block;margin-top:12px;font-size:13px;color:var(--terra);border-bottom:1px solid var(--terra)}
.empty{background:#fff;border:1px dashed var(--line);padding:60px 20px;text-align:center;color:#8d8577;font-size:14.5px}
.err{background:#fff3ee;border:1px solid #e2b4a0;padding:20px;color:#8a4a30;font-size:14px}
.count{font-size:13px;color:#8d8577;margin-bottom:16px}
/* 게이트 */
#gate{max-width:420px;margin:200px auto 0;background:#fff;border:1px solid var(--line);padding:44px 38px;text-align:center}
#gate h1{font-size:22px;margin-bottom:8px}
#gate p{font-size:13.5px;color:#8d8577;margin-bottom:26px}
#gate input{width:100%;border:1px solid var(--line);background:var(--bg);padding:13px 14px;font-size:15px;text-align:center;letter-spacing:2px;font-family:inherit}
#gate input:focus{outline:1px solid var(--terra)}
#gate button{margin-top:18px;width:100%;background:var(--terra);color:#fff;border:0;padding:14px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
#gate button:hover{background:#b56a4c}
#gerr{color:#b0502e;font-size:13px;margin-top:12px;min-height:20px}
#panel{display:none}
.logout{border:1px solid var(--line);color:#8d8577;background:transparent;padding:6px 14px;font-size:12.5px;cursor:pointer;float:right}
@media(max-width:767px){.wrap{padding:120px 16px 90px}#gate{margin-top:140px}}
</style>
</head>
<body>
<nav><div class="navin"><a class="logo" href="./">JEJUGRAPHER</a><a class="back" href="./">← 메인으로</a></div></nav>

<!-- 접근 게이트 (관리자 전용) -->
<div id="gate">
  <h1>관리자 확인</h1>
  <p>문의 관리 페이지는 관리자만 볼 수 있습니다.</p>
  <input id="pw" type="password" placeholder="접근 코드" onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">입장</button>
  <div id="gerr"></div>
</div>

<!-- 관리 패널 -->
<div class="wrap" id="panel">
  <button class="logout" onclick="lock()">잠그기</button>
  <h1>문의 관리</h1>
  <p class="lead">문의 게시판에 등록된 모든 문의를 한곳에서 봅니다. 답변·종결 처리는 각 문의의 게시판 링크에서 합니다.</p>
  <div class="tabs">
    <button class="tab on" data-s="all">전체</button>
    <button class="tab" data-s="open">미답변</button>
    <button class="tab" data-s="closed">완료</button>
  </div>
  <div class="count" id="count"></div>
  <div id="list"><div class="empty">문의를 불러오는 중…</div></div>
</div>

<script>
/* 접근 코드 변경법: 새 코드의 SHA-256 해시로 아래 HASH 값을 교체
   (터미널: echo -n '새코드' | shasum -a 256)  — 초기 코드: jeju2026 */
const HASH='41110273c8e24471ea0c2e60fea1d5cca78bc22007eb41eeee15486f0aa5e387';
const REPO='jejugrapher/jejugrapher-website';
let items=[],mode='all',loaded=false;

async function sha(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function unlock(){
  const v=document.getElementById('pw').value;
  if(await sha(v)===HASH){
    sessionStorage.setItem('jg_admin','1'); show();
  }else{
    document.getElementById('gerr').textContent='코드가 올바르지 않습니다.';
    document.getElementById('pw').value='';
  }
}
function lock(){sessionStorage.removeItem('jg_admin');location.reload();}
function show(){
  document.getElementById('gate').style.display='none';
  document.getElementById('panel').style.display='block';
  if(!loaded){loaded=true;fetchList();}
}
function fmt(d){const t=new Date(d);const p=n=>String(n).padStart(2,'0');
  return `${t.getFullYear()}.${p(t.getMonth()+1)}.${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){
  const list=document.getElementById('list');
  const arr=items.filter(i=>mode==='all'||i.state===mode);
  document.getElementById('count').textContent=`전체 ${items.length}건 · 미답변 ${items.filter(i=>i.state==='open').length}건 · 완료 ${items.filter(i=>i.state==='closed').length}건`;
  if(!arr.length){list.innerHTML='<div class="empty">해당하는 문의가 아직 없습니다.</div>';return;}
  list.innerHTML=arr.map(i=>`
    <div class="card">
      <div class="chead">
        <div><div class="ct">${esc(i.title)}</div>
        <div class="cmeta">${esc(i.user.login)} · ${fmt(i.created_at)} · 댓글 ${i.comments}</div></div>
        <span class="state ${i.state}">${i.state==='open'?'미답변':'완료'}</span>
      </div>
      ${i.body?`<div class="cbody">${esc(i.body).slice(0,800)}</div>`:''}
      <a class="clink" href="${i.html_url}" target="_blank" rel="noopener">게시판에서 답변하기 ↗</a>
    </div>`).join('');
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.s; render();
});
function fetchList(){
  fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=100&sort=created&direction=desc`)
   .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
   .then(d=>{items=d.filter(i=>!i.pull_request);render();})
   .catch(e=>{document.getElementById('list').innerHTML=
     `<div class="err">문의 목록을 불러오지 못했습니다 (${e.message}). 잠시 후 새로고침하거나, <a style="text-decoration:underline" href="https://github.com/${REPO}/issues" target="_blank" rel="noopener">게시판에서 직접 확인</a>해 주세요.</div>`;});
}
if(sessionStorage.getItem('jg_admin')==='1') show();
</script>
</body>
</html>
