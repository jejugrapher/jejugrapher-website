<style>
:root{--bg:#F8F4EC;--paper:#FFFDF8;--navy:#1F3A5F;--terra:#C97B5B;--ink:#2C2825;--line:#E3DCCE;--mute:#6E675E;
--serif:"Gowun Batang","Noto Serif KR",serif;--sans:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font:400 1rem/1.7 var(--sans);background:var(--bg);color:var(--ink);display:flex;justify-content:center;
 padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));word-break:keep-all}
.card{width:min(420px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;
 padding:26px 22px 22px;box-shadow:0 10px 30px rgba(44,40,37,.07)}
.top{text-align:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.org{font-family:var(--serif);font-size:13.5px;letter-spacing:.22em;color:var(--terra);margin-bottom:.5rem}
h1{font-family:var(--serif);font-weight:700;font-size:2rem;letter-spacing:.06em;color:var(--navy);line-height:1.25}
h1 small{display:inline-block;font-family:var(--sans);font-weight:400;font-size:.92rem;letter-spacing:0;color:var(--mute);margin-left:.5rem}
.en{font-size:.86rem;color:var(--mute);letter-spacing:.04em;margin-top:.15rem}
.tag{margin-top:.7rem;font-size:.95rem;color:var(--ink)}
.blurb{margin-top:.35rem;font-size:.88rem;color:var(--mute);line-height:1.65}
.qrbox{margin:20px 0 6px;text-align:center}
.qrbox button{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;
 padding:18px 18px 12px;cursor:pointer;font:inherit;color:inherit}
.qrbox svg{width:min(260px,66vw);height:auto;display:block;margin:0 auto}
.qrcap{margin-top:10px;font-size:.84rem;color:var(--mute)}
.site{display:block;text-align:center;margin:10px 0 18px;font-family:var(--serif);font-size:1.05rem;
 color:var(--navy);text-decoration:none;letter-spacing:.02em}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts a{display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;border-radius:11px;
 border:1px solid var(--line);background:#fff;color:var(--navy);text-decoration:none;font-size:.95rem;font-weight:500}
.acts a:active{background:var(--bg)}
.acts a.pri{grid-column:1/-1;background:var(--navy);color:#fff;border-color:var(--navy)}
.acts a.ter{grid-column:1/-1;background:var(--terra);color:#fff;border-color:var(--terra)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{flex:1 1 auto;text-align:center;font-size:.86rem;color:var(--mute);text-decoration:none;
 border:1px solid var(--line);border-radius:999px;padding:.5em .9em;background:#fff}
.addr{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.82rem;color:var(--mute);line-height:1.7;text-align:center}
/* QR 전체 화면 */
#full{position:fixed;inset:0;background:#fff;display:none;place-items:center;padding:24px;z-index:50}
#full.on{display:grid}
#full svg{width:min(86vw,86vh);height:auto}
#full p{position:fixed;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;color:#6E675E;font-size:.9rem}
@media (prefers-color-scheme:dark){
  :root{--bg:#15181C;--paper:#1C2026;--ink:#E7EAEE;--mute:#A7B0BA;--line:#2C333B;--navy:#CFE0F2;--terra:#E2A183}
  body{background:#15181C;color:#E7EAEE}
  .card{background:#1C2026;border-color:#2C333B;box-shadow:none}
  .top{border-color:#2C333B} h1{color:#CFE0F2} .site{color:#CFE0F2}
  .qrbox button{background:#fff;border-color:#2C333B}
  .acts a{background:#232931;border-color:#2C333B;color:#CFE0F2}
  .acts a.pri{background:#CFE0F2;color:#15181C;border-color:#CFE0F2}
  .acts a.ter{background:#E2A183;color:#15181C;border-color:#E2A183}
  .links a{background:#232931;border-color:#2C333B} .addr{border-color:#2C333B}
}
</style>
