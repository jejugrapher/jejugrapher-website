<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로그램 안내 · 2026생태관광주간</title>
<meta name="description" content="2026생태관광주간 가을 생태관광 프로그램 안내">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:type" content="article">
<meta property="og:site_name" content="2026생태관광주간">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="프로그램 안내 · 2026생태관광주간">
<meta property="og:description" content="2026생태관광주간 가을 생태관광 프로그램 안내">
<meta property="og:image" content="https://jejuecotourism.com/assets/hero.jpg">
<meta property="og:url" content="https://jejuecotourism.com/program.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://jejuecotourism.com/program.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --maple:#C0492B;--maple-soft:#D9743F;--persimmon:#E0913C;--gold:#E7B45A;
  --forest:#2F5E3A;--forest-deep:#1E3F27;--moss:#6B8F5A;--grass:#D8C9A3;
  --bg:#F7F2E8;--bg-deep:#EFE6D4;--card:#FFF;--ink:#2A2320;--ink-soft:#5E5248;--ink-faint:#8B7E70;
  --line:#E6DAC4;--line-soft:#F0E7D6;--shadow:0 1px 2px rgba(60,40,20,.04),0 6px 20px rgba(120,70,30,.07);
  --shadow-lg:0 14px 44px rgba(120,70,30,.14);--r:16px;--r-lg:24px;--maxw:960px;
}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.tbd{display:inline-block;font-size:.72rem;font-weight:700;color:#9A6B14;background:#FBEFCF;border:1px solid #EAD59A;border-radius:999px;padding:.12em .6em}
.badge{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:.16em .7em}
.badge.free{color:#1E6B3A;background:#DFF0E2;border:1px solid #B7DCC0}
.badge.paid{color:#8A4A1E;background:#F6E6D3;border:1px solid #E7CBA9}
.badge.new{color:#fff;background:var(--maple)}
.badge.center{color:#274E6B;background:#DEEAF2;border:1px solid #BAD3E4}
.badge.cat{color:#fff;background:var(--forest)}
.badge.demo{color:#5A3A86;background:#ECE3F7;border:1px solid #D3C2ED}
.badge.closed{color:#fff;background:#8B7E70}
.nav{position:sticky;top:0;z-index:50;background:rgba(247,242,232,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:60px;max-width:var(--maxw);margin:0 auto;padding:0 22px}
.nav-logo{display:flex;align-items:center;gap:9px;font-family:"Noto Serif KR",serif;font-weight:700;color:var(--forest-deep)}
.nav-logo .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--maple),var(--persimmon));display:grid;place-items:center;color:#fff;font-size:.85rem}
.back{font-size:.9rem;font-weight:600;color:var(--maple)}
.hero{position:relative;aspect-ratio:16/7;background:linear-gradient(135deg,var(--grass),#EFE6D2);display:grid;place-items:center;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .ph{color:#B39A6E;font-weight:600;font-size:.95rem;text-align:center}
.hero .ph small{display:block;margin-top:6px}
.head{padding:30px 0 6px}
.crumbs{font-size:.85rem;color:var(--ink-faint);margin-bottom:10px}
.title{font-family:"Noto Serif KR",serif;font-weight:700;font-size:clamp(1.7rem,4.5vw,2.6rem);color:var(--forest-deep);line-height:1.25}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.grid2{display:grid;grid-template-columns:1.3fr .9fr;gap:30px;padding:18px 0 60px}
@media(max-width:800px){.grid2{grid-template-columns:1fr;gap:22px}}
.sec-h{font-family:"Noto Serif KR",serif;font-weight:700;font-size:1.2rem;color:var(--forest-deep);margin:24px 0 10px}
.desc{font-size:1.05rem;color:var(--ink-soft)}
.detail{color:var(--ink-soft);margin-top:8px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.gallery .g{aspect-ratio:1;background:linear-gradient(135deg,#EFE6D2,#E3D6BB);border-radius:12px;display:grid;place-items:center;color:#B39A6E;font-size:.76rem;font-weight:600}
.posters{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px}
.posters a{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
.posters img{width:100%;height:auto;display:block}
.info{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);position:sticky;top:78px}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:.94rem}
.info dt{color:var(--ink-faint);font-weight:700}
.info dd{color:var(--ink)}
.btns{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:999px;padding:.85em 1.2em;cursor:pointer;border:0;font-size:.95rem}
.btn.primary{background:var(--maple);color:#fff}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--forest)}
#mini{height:200px;border-radius:14px;border:1px solid var(--line);margin-top:14px}
.miss{padding:80px 0;text-align:center;color:var(--ink-soft)}
footer{background:linear-gradient(180deg,var(--gold),var(--persimmon));color:#3A2A14;padding:34px 0;font-size:.9rem}
</style>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="nav-logo" href="index.html"><span class="mark">가</span>2026생태관광주간</a>
  <a class="back" href="index.html#programs" onclick="if(document.referrer&&history.length>1){history.back();return false;}">← 프로그램 목록</a>
</div></nav>

<div id="app"></div>

<footer><div class="wrap">
  <b>2026생태관광주간</b> · 주최 제주생태관광협회 · 제주생태관광지원센터<br>
  대표전화 <a href="tel:0647823253" style="font-weight:700">064-782-3253</a> · 예약 <a href="https://www.tamnao.com/web/evnt/detailPromotion.do?prmtDiv=PLAN&prmtNum=PM00002412" target="_blank" rel="noopener" style="font-weight:700">탐나오 기획전 페이지 ↗</a>
</div></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/data.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const p=PROGRAMS.find(x=>x.id===id);
const app=document.getElementById('app');

function badges(p){let s=`<span class="badge cat">${p.cat}</span>`;
  if(p.closed)s+='<span class="badge demo">시범 프로그램</span><span class="badge closed">모집 마감</span>';
  else s+=(p.fee||'').trim()==='무료'?'<span class="badge free">무료</span>':(p.fee==='미정'?'<span class="tbd">요금 미정</span>':'<span class="badge paid">유료</span>');
  (p.tags||[]).forEach(t=>{if(t==='new')s+='<span class="badge new">신규</span>';if(t==='center')s+='<span class="badge center">센터 단독</span>';});
  if(p.tbd)s+='<span class="tbd">자료 미제출</span>';return s;}
const v=x=>(!x||x==='미정')?'<span class="tbd">미정</span>':x;

if(!p){
  app.innerHTML=`<div class="wrap miss"><h1 style="font-family:'Noto Serif KR',serif">프로그램을 찾을 수 없습니다</h1>
    <p style="margin-top:10px">주소의 id 값을 확인해 주세요. <a class="back" href="index.html#programs">프로그램 목록으로</a></p></div>`;
}else{
  document.title=`${p.title} · 2026생태관광주간`;
  // 검색엔진·공유용 메타 갱신(프로그램별)
  (function(){
    const site='https://jejuecotourism.com', url=`${site}/program.html?id=${p.id}`;
    const desc=(p.desc||'2026생태관광주간 가을 생태관광 프로그램 안내').replace(/<[^>]+>/g,'').slice(0,150);
    const img=p.img?`${site}/${p.img}`:`${site}/assets/hero.jpg`;
    const set=(sel,attr,val)=>{const el=document.querySelector(sel);if(el)el.setAttribute(attr,val);};
    set('meta[name="description"]','content',desc);
    set('meta[property="og:title"]','content',`${p.title} · 2026생태관광주간`);
    set('meta[property="og:description"]','content',desc);
    set('meta[property="og:image"]','content',img);
    set('meta[property="og:url"]','content',url);
    set('link[rel="canonical"]','href',url);
    const ld={"@context":"https://schema.org","@type":"Event","name":p.title,"description":desc,"url":url,"image":[img],
      "startDate":"2026-10-03","endDate":"2026-10-09","eventStatus":"https://schema.org/EventScheduled",
      "eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","inLanguage":"ko",
      "location":{"@type":"Place","name":(p.place&&p.place!=='미정')?p.place:(p.region||'제주특별자치도'),"address":{"@type":"PostalAddress","addressRegion":"제주특별자치도","addressCountry":"KR"}},
      "organizer":{"@type":"Organization","name":p.op||"제주생태관광협회"},
      "superEvent":{"@type":"Event","name":"2026 생태관광주간 · 제주","url":site+"/"}};
    if(p.closed){ld.eventStatus="https://schema.org/EventScheduled";ld.offers={"@type":"Offer","availability":"https://schema.org/SoldOut","price":"0","priceCurrency":"KRW"};}
    else if((p.fee||'').trim()==='무료'){ld.offers={"@type":"Offer","price":"0","priceCurrency":"KRW","availability":"https://schema.org/InStock"};}
    const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(ld);document.head.appendChild(s);
  })();
  app.innerHTML=`
  <header class="hero">
    <img src="${p.img||('assets/il_'+p.id+'.png')}" alt="${p.title}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <div class="ph" style="display:none">🎨 대표 이미지 예정<small>${p.img||('assets/il_'+p.id+'.png')} · 미정</small></div>
  </header>
  <div class="wrap">
    <div class="head">
      <div class="crumbs">프로그램 · ${p.cat}</div>
      <h1 class="title">${p.title}</h1>
      <div class="tagrow">${badges(p)}</div>
    </div>
    <div class="grid2">
      <div>
        <p class="desc">${p.desc||'<span class="tbd">소개 미정</span>'}</p>
        <div class="sec-h">프로그램 안내</div>
        <p class="detail">${p.detail||'<span class="tbd">미정</span>'}</p>
        ${p.note?`<p class="detail" style="color:var(--maple);margin-top:8px">※ ${p.note}</p>`:''}
        ${(p.posters&&p.posters.length)?`<div class="sec-h">안내 포스터</div>
        <div class="posters">${p.posters.map(u=>`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="${p.title} 안내 포스터" loading="lazy"></a>`).join('')}</div>
        <p class="detail" style="font-size:.85rem;color:var(--ink-faint);margin-top:8px">※ 포스터를 누르면 크게 볼 수 있습니다.</p>`:''}
        <div class="sec-h">사진</div>
        <div class="gallery">
          ${(p.gallery&&p.gallery.length)
            ? p.gallery.map(g=>`<a class="g" href="${g}" target="_blank" style="padding:0;overflow:hidden"><img src="${g}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='사진 미정'"></a>`).join('')
            : '<div class="g">대표 이미지<br>미정</div><div class="g">사진 미정</div><div class="g">사진 미정</div>'}
        </div>
        <p class="detail" style="font-size:.85rem;color:var(--ink-faint);margin-top:8px">※ 사진은 각 운영처 제공. 대표 이미지·추가 사진은 확정되는 대로 보완됩니다.</p>
      </div>
      <aside>
        <div class="info">
          <dl>
            <dt>운영</dt><dd>${p.op||'<span class="tbd">미정</span>'}</dd>
            <dt>지역</dt><dd>${p.region||'<span class="tbd">미정</span>'}</dd>
            <dt>모임</dt><dd>${v(p.place)}</dd>
            <dt>일정</dt><dd>${v(p.date)}</dd>
            <dt>요금</dt><dd>${p.closed?'무료 (시범 · 모집 마감)':((p.fee||'').trim()==='무료'?'무료':v(p.fee))}</dd>
            <dt>대상</dt><dd>${v(p.target)}</dd>
            <dt>준비물</dt><dd>${v(p.prep)}</dd>
          </dl>
          <div class="btns">
            ${p.closed
              ? `<span class="btn line" style="opacity:.6;cursor:default">시범 프로그램 · 모집 마감</span>`
              : ((p.tamnao||TAMNAO_PLAN)
                  ? `<a class="btn primary" href="${p.tamnao||TAMNAO_PLAN}" target="_blank" rel="noopener">예약하기 (탐나오${p.tamnao?'':' 기획전'})</a>`
                  : `<a class="btn primary" href="#" onclick="return false">예약하기 <span class="tbd">탐나오 링크 미정</span></a>`)}
            ${p.tel ? `<a class="btn line" href="tel:${(p.tel.match(/0\d[\d-]{6,}\d/)||[''])[0].replace(/-/g,'')}">담당처 문의 · ${p.tel}</a>` : `<a class="btn line" href="#" onclick="return false">담당처 문의 <span class="tbd">연락처 미정</span></a>`}
            <button class="btn line" type="button" id="shareBtn">↗ 공유하기</button>
          </div>
          ${p.ll?'<div id="mini"></div>':'<p class="detail" style="font-size:.85rem;margin-top:12px"><span class="tbd">위치 미정</span></p>'}
        </div>
      </aside>
    </div>
  </div>`;
  if(p.ll){const m=L.map('mini',{scrollWheelZoom:false,dragging:false}).setView(p.ll,11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
    L.marker(p.ll).addTo(m).bindPopup(`${p.title}<br><small style="color:#9A6B14">${p.place&&p.place!=='미정'?p.place:'정확한 주소 미정'}</small>`);}
  const sb=document.getElementById('shareBtn');
  if(sb)sb.onclick=async()=>{
    const data={title:`${p.title} · 2026생태관광주간`,text:p.desc||'',url:location.href};
    if(navigator.share){try{await navigator.share(data);return;}catch(e){if(e.name==='AbortError')return;}}
    try{await navigator.clipboard.writeText(location.href);alert('링크를 복사했습니다.\n'+location.href);}
    catch(e){prompt('아래 링크를 복사하세요',location.href);}
  };
}
</script>
</body>
</html>
