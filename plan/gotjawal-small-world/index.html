<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>곶자왈 작은 세계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 숲 그늘의 어둠을 바탕으로, 작은 빛(호박색)과 이끼(초록)만 강조색으로 쓴다. 넓은 사진 띠 + 좁은 읽기 단. 단일 다크 테마(야간·그늘이 주제). */
:root{
  --ground:#0d1310;      /* 곶자왈 그늘 */
  --ground-2:#141c17;
  --panel:#18221c;
  --line:#2a3830;
  --ink:#e9eee6;
  --ink-soft:#a9b8ac;
  --ink-faint:#748478;
  --lantern:#f0b35a;     /* 작은 조명 */
  --lantern-soft:#3a2c17;
  --moss:#8fc79a;        /* 이끼 */
  --moss-soft:#1f3326;
  --warn:#f08a6c;
  --display:"Gowun Batang", "AppleMyungjo", "Nanum Myeongjo", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --maxw:1120px; --read:680px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.3}
h3{font-size:1.2rem;line-height:1.4}
p{margin:0}
a{color:var(--lantern)}
:focus-visible{outline:2px solid var(--lantern);outline-offset:3px;border-radius:4px}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
.lede{color:var(--ink-soft);max-width:var(--read);font-size:1.02rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
section{padding-block:clamp(56px,8vw,96px);border-top:1px solid var(--line)}
.sec-head{display:grid;gap:12px;margin-bottom:32px;max-width:var(--read)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:18px;align-items:center;height:52px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav b{font-family:var(--display);font-size:1.02rem;color:var(--ink);margin-right:8px}
.nav a{color:var(--ink-soft);text-decoration:none;font-size:.9rem}
.nav a:hover{color:var(--lantern)}

/* hero */
.hero{padding-block:clamp(40px,7vw,80px) clamp(40px,6vw,64px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,4vw,56px);align-items:center}
.hero h1{font-size:clamp(2.4rem,6.4vw,4.4rem);line-height:1.12;margin:14px 0 18px}
.hero h1 .glow{color:var(--lantern);text-shadow:0 0 28px rgba(240,179,90,.35)}
.hero .sub{color:var(--ink-soft);font-size:1.08rem;max-width:34em}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.facts span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.86rem;color:var(--ink-soft)}
.hero-pics{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto auto;gap:10px}
.hero-pics figure{margin:0;position:relative;overflow:hidden;border-radius:6px;background:var(--ground-2)}
.hero-pics figure:first-child{grid-row:span 2}
.hero-pics img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:auto}
.hero-pics figure:first-child img{aspect-ratio:3/4}
.hero-pics figure:not(:first-child) img{aspect-ratio:4/3}
.tag{position:absolute;left:8px;bottom:8px;font-size:.72rem;background:rgba(8,12,10,.72);color:var(--ink);padding:2px 8px;border-radius:4px}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}}

/* diagrams */
.figure{background:var(--ground-2);border:1px solid var(--line);border-radius:8px;padding:clamp(14px,2.4vw,24px)}
.figure .scroll{overflow-x:auto}
.figure svg{display:block;width:100%;height:auto;min-width:640px}
.figure figcaption,.cap{color:var(--ink-faint);font-size:.84rem;margin-top:10px}
svg text{font-family:var(--body)}

/* two program cards */
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.prog div{border-top:2px solid var(--moss);padding-top:12px}
.prog div.night{border-color:var(--lantern)}
.prog b{display:block;font-size:1.02rem}
.prog .t{font-family:var(--mono);font-size:.82rem;color:var(--ink-faint)}
.prog p{color:var(--ink-soft);font-size:.93rem;margin-top:6px}
@media (max-width:760px){.prog{grid-template-columns:1fr}}

/* galleries */
.gal{display:grid;gap:10px}
.gal figure{margin:0;position:relative;overflow:hidden;border-radius:6px;background:var(--ground-2);cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.gal figure:hover img{transform:scale(1.03)}
.gal figcaption small,.tag small{display:block;opacity:.72;font-size:.66rem;margin-top:1px}
.credits{columns:2;column-gap:28px;font-size:.78rem;color:var(--ink-faint);margin:14px 0 0;padding:0;list-style:none}
.credits li{break-inside:avoid;margin:0 0 6px}
.credits a{color:inherit}
@media (max-width:760px){.credits{columns:1}}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:.78rem;color:var(--ink);background:linear-gradient(transparent,rgba(6,9,7,.85))}
.g-field{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:150px}
.g-field .w2{grid-column:span 2}.g-field .w3{grid-column:span 3}.g-field .h2{grid-row:span 2}
.g-art{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:180px}
.g-art .w2{grid-column:span 2}.g-art .h2{grid-row:span 2}
.g-night{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:170px}
.g-night .w2{grid-column:span 2}.g-night .h2{grid-row:span 2}
@media (max-width:760px){.g-field,.g-art,.g-night{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:140px}.g-field .w3{grid-column:span 2}.gal .h2{grid-row:span 1}}
.src{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 0;color:var(--ink-faint);font-size:.82rem}
.src i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* video */
.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.vid{margin:0}
.vid video{width:100%;aspect-ratio:16/9;display:block;border-radius:6px;background:#000;object-fit:cover}
.vid figcaption{font-size:.86rem;color:var(--ink-soft);margin-top:8px}
.vid figcaption b{color:var(--ink);display:block;font-weight:600}
@media (max-width:820px){.vids{grid-template-columns:1fr}}
.yt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.yt a{display:grid;gap:8px;text-decoration:none;color:var(--ink)}
.yt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.yt span{font-size:.88rem;line-height:1.45}
.yt small{display:block;color:var(--ink-faint);font-family:var(--mono);font-size:.76rem}
@media (max-width:820px){.yt{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-soft);background:var(--ground-2);font-size:.82rem;letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* light grid */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}

/* missions */
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mission{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--ground-2);display:grid;gap:6px;align-content:start}
.mission b{font-size:1.02rem}
.mission .q{color:var(--moss);font-family:var(--display);font-size:.98rem}
.mission .l{font-size:.8rem;color:var(--lantern);font-family:var(--mono)}
.mission p{color:var(--ink-soft);font-size:.9rem}
@media (max-width:860px){.missions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:520px){.missions{grid-template-columns:1fr}}

/* promises */
.promise{counter-reset:p;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px;padding:0;margin:0;list-style:none}
.promise li{counter-increment:p;display:grid;grid-template-columns:2.2em 1fr;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.promise li::before{content:counter(p);font-family:var(--mono);color:var(--lantern)}
.promise li.key{color:var(--ink)}
.promise li.key b{color:var(--lantern)}
@media (max-width:760px){.promise{grid-template-columns:1fr}}

.note{border-left:3px solid var(--lantern);padding:10px 16px;background:var(--lantern-soft);border-radius:0 6px 6px 0;color:var(--ink);font-size:.93rem;max-width:var(--read)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
ul.plain{margin:0;padding-left:1.1em;color:var(--ink-soft)}
ul.plain li{margin:4px 0}
ul.plain b{color:var(--ink)}

footer{border-top:1px solid var(--line);padding-block:36px 56px;color:var(--ink-faint);font-size:.86rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 28px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(4,6,5,.94);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:4px}
.lb p{color:var(--ink-soft);font-size:.9rem;text-align:center;margin-top:12px}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
</style>

<!-- jg-page-gate -->
<section class="lockwrap" style="min-height:62vh;display:grid;place-items:center;padding:4rem 1rem;background:var(--bg-soft,#f4efe6)">
  <div style="max-width:430px;width:100%;text-align:center">
    <div style="font-size:.78rem;letter-spacing:.2em;color:var(--text-mute,#8C8578);margin-bottom:.9rem">PRIVATE · PLANNING</div>
    <h1 style="font-size:1.6rem;line-height:1.4;margin-bottom:.8rem;color:var(--text-main,#2b2b2b)">곶자왈 작은 세계 — 빛으로 찾는 숲</h1>
    <p style="color:var(--text-soft,#5b5b5b);line-height:1.75;margin-bottom:1.6rem">안내받은 비밀번호를 넣으면 기획 내용이 열립니다.</p>
    <form id="lkf" autocomplete="off" style="display:flex;gap:.5rem;justify-content:center">
      <input id="lkp" type="password" inputmode="numeric" placeholder="비밀번호" aria-label="비밀번호" required
             style="flex:1;max-width:220px;padding:.75rem .9rem;border:1px solid var(--border-line,#d8d0c2);border-radius:9px;font:inherit">
      <button type="submit" style="padding:.75rem 1.3rem;border:0;border-radius:9px;background:var(--text-main,#1F3A5F);color:#fff;font:inherit;cursor:pointer">열기</button>
    </form>
    <p id="lkm" role="status" style="min-height:1.5em;margin-top:.9rem;color:var(--text-mute,#8C8578);font-size:.92rem"></p>
    <p style="margin-top:1.6rem;font-size:.9rem;color:var(--text-mute,#8C8578)">
      비밀번호가 필요하시면 <a href="/inquiry.html" style="color:var(--accent-terracotta,#C97B5B)">문의</a>해 주세요.</p>
  </div>
</section>

  var u8=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})};
  async function open_(pw){
    var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(L.s),iterations:L.n,hash:"SHA-256"},k0,
                                        {name:"AES-GCM",length:256},false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(L.i)},k,u8(L.c)));
    var box=document.querySelector(".lockwrap");
    box.insertAdjacentHTML("beforebegin",html);
    box.remove();
    document.querySelectorAll("section script, header script, article script").forEach(function(old){
      var s=document.createElement("script");
      if(old.src)s.src=old.src; else s.textContent=old.textContent;
      old.replaceWith(s);
    });
    window.scrollTo(0,0);
  }
  document.getElementById("lkf").addEventListener("submit",async function(e){

    var m=document.getElementById("lkm"); m.textContent="여는 중…";

    catch(err){ m.textContent="비밀번호가 맞지 않습니다."; }

  /* 관리자 「바로 열기」 — 주소 뒤 #pw=... 로 들어오면 자동으로 연다.

  try{
    var hm=(location.hash||"").match(/[#&]pw=([^&]+)/);
    if(hm){
      history.replaceState(null,"",location.pathname+location.search);
      var pw=decodeURIComponent(hm[1]);
      document.getElementById("lkm").textContent="여는 중…";
      open_(pw).catch(function(){document.getElementById("lkm").textContent="비밀번호가 맞지 않습니다.";});
