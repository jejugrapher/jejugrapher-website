<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>제주그래퍼 IR 피칭 자료</title>
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1c2420; --muted:#59645d; --line:#ddd6c6;
  --accent:#1f6f5c; --accent-soft:#dcebe5; --warm:#b4552d; --warm-soft:#f6e3d8; --dark:#14201c; --gold:#c9a24a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  line-height:1.7;font-size:17px;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
a{color:var(--accent)}
img,video{max-width:100%;display:block}
sup.s{font-size:11px;font-weight:600;margin-left:1px}
sup.s a{text-decoration:none;color:var(--accent)}

/* 첫 화면 */
.hero{background:var(--dark);color:#f3efe4;padding:64px 0 56px}
.tag{display:inline-block;font-size:13px;letter-spacing:.08em;border:1px solid #4d5d56;color:#b9c6bf;padding:3px 10px;border-radius:99px;margin-bottom:20px}
.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.28;margin:0 0 18px;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:#7fd3b8}
.hero .sub{font-size:clamp(17px,2.2vw,20px);color:#cfd8d2;max-width:760px;margin:0}
.herogrid{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:center;margin-top:34px}
.herovid{border-radius:14px;overflow:hidden;background:#000}
.herovid video{width:100%;aspect-ratio:16/9;object-fit:cover}
.herocap{font-size:13px;color:#a9b7b0;margin-top:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpis div{border-top:1px solid #3a4a43;padding-top:12px}
.kpis b{display:block;font-size:clamp(22px,3vw,30px);color:#fff;font-variant-numeric:tabular-nums;line-height:1.2}
.kpis span{font-size:14px;color:#a9b7b0;display:block;margin-top:4px}
.kpis sup.s a{color:#8fd3bd}

.thirty{background:#1c2a25;padding:30px 0 34px;color:#e9efe9}
.thirty h2{color:#fff;font-size:18px;margin:0 0 14px;letter-spacing:.02em}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.q4 div{background:#24352f;border-radius:12px;padding:16px 16px 14px}
.q4>div>b{display:block;color:#8fd3bd;font-size:13px;letter-spacing:.06em;margin-bottom:6px}
.q4 p{margin:0;font-size:15.5px;line-height:1.6;color:#e2ebe5}
.q4 sup.s a{color:#8fd3bd}

/* 목차 */
.steps{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.steps .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:9px;padding-bottom:9px;scrollbar-width:none}
.steps .wrap::-webkit-scrollbar{display:none}
.steps a{flex:none;text-decoration:none;color:var(--muted);font-size:14px;padding:6px 11px;border-radius:99px;white-space:nowrap}
.steps a:hover{background:var(--accent-soft);color:var(--accent)}

section{padding:60px 0;border-bottom:1px solid var(--line)}
.num{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.slide{display:inline-block;font-size:12px;font-weight:700;color:var(--warm);background:var(--warm-soft);padding:2px 9px;border-radius:99px;margin-left:8px;vertical-align:2px}
h2{font-size:clamp(24px,3.6vw,33px);line-height:1.32;margin:6px 0 14px;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:19px;margin:0 0 6px;line-height:1.4}
.lead{font-size:18.5px;color:var(--muted);max-width:760px;margin:0 0 26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.card p{margin:0;color:var(--muted);font-size:16px}
.card .who{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin-bottom:6px;display:block}
.card.hl{border:2px solid var(--accent);background:var(--accent-soft)}
.card.hl p{color:#21463c}
ul.plain{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:16px}
ul.plain li{margin:4px 0}
.callout{background:var(--dark);color:#f3efe4;border-radius:14px;padding:24px 26px;margin-top:26px;font-size:clamp(18px,2.4vw,22px);font-weight:700;line-height:1.55}
.callout em{font-style:normal;color:#8fd3bd}
.callout small{display:block;font-size:15px;font-weight:400;color:#b9c6bf;margin-top:8px;line-height:1.7}

/* 흐름 */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px}
.flow .st{background:var(--paper);border:1px solid var(--line);padding:20px 18px;position:relative}
.flow .st:first-child{border-radius:14px 0 0 14px}
.flow .st:last-child{border-radius:0 14px 14px 0;background:var(--accent-soft);border-color:#b9d6cb}
.flow .st+.st{border-left:0}
.flow .st:not(:last-child)::after{content:"";position:absolute;right:-11px;top:50%;width:20px;height:20px;background:inherit;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.flow .k{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.flow h3{font-size:20px;margin:2px 0 8px}
.flow p{margin:0;font-size:15.5px;color:var(--muted)}

/* 실적 */
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.work{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.work img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#111}
.work .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.work .t{font-weight:700;font-size:17px}
.work .n{font-size:15px;color:var(--ink)}
.work .n b{color:var(--accent);font-variant-numeric:tabular-nums}
.work .d{font-size:14.5px;color:var(--muted)}
.work a.go{margin-top:auto;padding-top:8px;font-size:14px;font-weight:600;text-decoration:none}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.badge.v{background:#e9e3f4;color:#5a3f8c}
.badge.w{background:var(--warm-soft);color:var(--warm)}

/* 숫자 막대 */
.mk{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.mk h3{font-size:17px}
.mk .src{font-size:13px;color:var(--muted);margin-top:8px}
.barrow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:28px;border-radius:6px;background:var(--accent);color:#fff;font-weight:700;font-size:13.5px;display:flex;align-items:center;padding:0 10px;white-space:nowrap;min-width:max-content}
.bar.l{background:#7fb7a5}
.big{font-size:clamp(26px,4vw,38px);font-weight:800;color:var(--accent);line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}

/* 표 */
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15.5px}
th,td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13.5px;color:var(--muted);font-weight:600;background:#faf7ef}
tr:last-child td{border-bottom:0}
td.p{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
table.vs td:nth-child(2){background:#fbf3ee;color:#6b3a22}
table.vs td:nth-child(3){background:var(--accent-soft);color:#12483b;font-weight:600}
.note{font-size:14px;color:var(--muted);margin-top:12px}

/* 로드맵 */
.road{position:relative;margin-top:10px}
.road .r{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line)}
.road .r:first-child{border-top:0}
.road .when{font-weight:800;color:var(--accent);font-size:15px}
.road .when small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.road h3{font-size:18px}
.road p{margin:2px 0 0;color:var(--muted);font-size:15.5px}

/* IR 8장 */
.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px;aspect-ratio:16/10.5;display:flex;flex-direction:column}
.sl .no{font-size:12px;font-weight:800;color:var(--warm);letter-spacing:.06em}
.sl h3{font-size:16px;margin:4px 0 6px}
.sl p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.sl a{margin-top:auto;font-size:12.5px;font-weight:600;text-decoration:none}

ol.src{font-size:14px;color:var(--muted);padding-left:22px;margin:0}
ol.src li{margin:6px 0}
ol.src a{word-break:break-all}
footer{padding:36px 0 60px;color:var(--muted);font-size:14px}

@media (max-width:900px){
  .q4,.grid4,.deck{grid-template-columns:1fr 1fr}
  .works{grid-template-columns:1fr 1fr}
  .flow{grid-template-columns:1fr 1fr;gap:10px}
  .flow .st,.flow .st:first-child,.flow .st:last-child{border-radius:14px;border:1px solid var(--line)}
  .flow .st:last-child{border-color:#b9d6cb}
  .flow .st::after{display:none}
}
@media (max-width:720px){
  body{font-size:16px}
  .herogrid,.grid2,.grid3{grid-template-columns:1fr}
  .q4,.grid4,.works,.flow{grid-template-columns:1fr}
  .deck{grid-template-columns:1fr}
  .sl{aspect-ratio:auto}
  section{padding:46px 0}
  .hero{padding:46px 0 40px}
  .road .r{grid-template-columns:1fr;gap:4px}
  .kpis b{font-size:24px}
  .lead{font-size:17px}
  table{font-size:15px}
}

@media (max-width:720px){
  .tablewrap.stack{background:none;border:0;overflow:visible}
  .stack table{min-width:0}
  .stack thead{display:none}
  .stack tr{display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
  .stack td{display:block;border:0;padding:8px 14px}
  .stack td::before{content:attr(data-label);display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
  .stack td:first-child{background:#faf7ef;font-weight:700}
  .stack td:first-child::before{display:none}
}

.pos{margin-top:22px;border-left:4px solid #7fd3b8;background:#1c2a25;border-radius:0 12px 12px 0;padding:16px 20px;max-width:860px}
.pos b{color:#fff;font-size:clamp(17px,2.2vw,20px);line-height:1.5;display:block}
.pos span{display:block;color:#b9c6bf;font-size:14.5px;margin-top:6px}
.pos sup.s a{color:#8fd3bd}
.tech{display:grid;gap:16px}
.tk{background:var(--paper);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:260px 1fr;overflow:hidden}
.tk>img{width:100%;height:100%;object-fit:cover;min-height:220px;background:#111}
.tk .b{padding:20px 22px}
.tk h3{font-size:20px;margin-bottom:10px}
.tk dl{display:grid;grid-template-columns:78px 1fr;gap:6px 12px;margin:0;font-size:15.5px}
.tk dt{font-weight:700;color:var(--accent);font-size:14px;padding-top:1px}
.tk dd{margin:0;color:var(--muted)}
.tk dd b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.two .card h3{font-size:18px}
.fn{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.65}
.qa details{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 20px;margin:10px 0}
.qa summary{cursor:pointer;padding:16px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:16px;font-size:17px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";color:var(--accent);font-size:22px;line-height:1}
.qa details[open] summary::after{content:"–"}
.qa details p{margin:0 0 16px;color:var(--muted)}
table.uq td.me{background:var(--accent-soft);color:#12483b;font-weight:600}
@media (max-width:720px){
  .tk{grid-template-columns:1fr}.tk>img{min-height:0;aspect-ratio:16/9}
  .tk dl{grid-template-columns:1fr;gap:2px}.tk dd{margin-bottom:8px}
  .two{grid-template-columns:1fr}
}
.aside{margin-top:18px;padding:12px 14px;border-left:3px solid #b9b2a3;background:rgba(0,0,0,.025);font-size:.92em;color:#555}.aside b{display:block;margin-bottom:4px;color:#333}.aside p{margin:0}
.bigthumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.bigthumbs a{display:block;color:inherit;text-decoration:none;font-size:.88em}.bigthumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}.bigthumbs span{display:block;margin-top:4px}
.gflow{margin-top:10px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.gflow>div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;line-height:1.35}.gflow b{display:block;color:var(--accent)}.gflow small{color:var(--muted)}@media(max-width:640px){.gflow{grid-template-columns:1fr 1fr}}
.gamecard{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;align-items:center}@media(max-width:640px){.gamecard{grid-template-columns:1fr}}
.pdfdl{margin:6px 0 16px}.pdfdl a{display:inline-block;padding:10px 16px;border-radius:8px;background:#1f3b33;color:#fff;text-decoration:none;font-weight:600}
.vis{padding:34px 0 10px}.vt{font-size:clamp(22px,3vw,30px);margin:18px 0 14px}
.dlbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--dark);color:#cfe1da;border-radius:14px;padding:14px 16px}
.dlbtn{display:inline-block;background:var(--gold);color:#14201c!important;text-decoration:none;font-weight:800;font-size:18px;padding:12px 20px;border-radius:10px}
.dlbar span{font-size:14px}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#111}
.gal figcaption{font-size:13.5px;padding:8px 10px;color:var(--muted);line-height:1.45}.gal figcaption b{display:block;color:var(--ink);font-size:15px}
.bignum{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:16px 0 6px}
.bignum div{background:var(--accent);color:#fff;border-radius:12px;padding:14px 12px}
.bignum b{display:block;font-size:clamp(22px,2.6vw,30px);line-height:1.15;font-variant-numeric:tabular-nums}.bignum span{font-size:13px;color:#dcebe5;line-height:1.4;display:block;margin-top:4px}
.pimg img{width:calc(100% + 44px);margin:-22px -22px 14px;aspect-ratio:16/8;object-fit:cover;border-radius:14px 14px 0 0;max-width:none}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin:18px 0}
.chart{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.chart figcaption{font-weight:800;margin-bottom:8px}.chart svg{width:100%;height:auto;display:block}
.mx{width:100%;border-collapse:collapse;font-size:13px;text-align:center}.mx th{font-weight:600;color:var(--muted);font-size:11.5px;padding:4px 2px;vertical-align:bottom}.mx td{padding:7px 2px;border-top:1px solid var(--line);font-size:15px}.mx td:first-child{text-align:left;font-size:13px}.mx tr.me td{background:var(--accent-soft);font-weight:800;color:var(--accent)}
.mxn{font-size:12px;color:var(--muted);margin:8px 0 0}
.flowfig{margin:18px 0}
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.road .r{display:block!important;border:0!important;background:var(--paper);border-radius:14px;padding:16px!important;position:relative;border-top:5px solid var(--accent)!important}
.road .r:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:14px;color:var(--accent);font-weight:800}
@media(max-width:860px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}.bignum{grid-template-columns:repeat(3,minmax(0,1fr))}.charts{grid-template-columns:1fr}.road{grid-template-columns:1fr 1fr}.road .r::after{display:none}}
@media(max-width:480px){.bignum{grid-template-columns:repeat(2,minmax(0,1fr))}.road{grid-template-columns:1fr}}
@media print{.dlbar{display:none!important}.gal,.bignum,.chart,.charts{break-inside:avoid}}
.more{margin-top:8px}.more summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px}.more dl{margin-top:8px}
.cmpv{margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.cmpv>figcaption{font-weight:800;margin-bottom:10px}.cmpgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cmpgrid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#111}.cmpgrid p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.45}.cmpgrid p b{display:block;color:var(--ink);font-size:14px}.cmpgrid .me{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}.cmpgrid .me b{color:var(--accent)}@media(max-width:640px){.cmpgrid{grid-template-columns:1fr 1fr}}@media print{.cmpv{break-inside:avoid}}
@page{size:A4;margin:14mm 12mm}
@media print{
 html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 nav.steps,.pdfdl,.go,video{display:none!important}
 .herovid{background:url(img/anduck_walk1.jpg) center/cover;min-height:200px}
 section{break-inside:auto;padding-top:18px!important;padding-bottom:18px!important}
 h2,h3,.num{break-after:avoid}
 .card,.work,.tk,.st,.sl,.r,.callout,tr,details,.q4>div{break-inside:avoid}
 details{display:block}details>summary{list-style:none}details>*{display:block!important}
 a{color:inherit;text-decoration:none}
}
</style>

<body>

<!-- jg-page-gate -->
<section class="lockwrap" style="min-height:62vh;display:grid;place-items:center;padding:4rem 1rem;background:var(--bg-soft,#f4efe6)">
  <div style="max-width:430px;width:100%;text-align:center">
    <div style="font-size:.78rem;letter-spacing:.2em;color:var(--text-mute,#8C8578);margin-bottom:.9rem">PRIVATE · IR PITCH</div>
    <h1 style="font-size:1.6rem;line-height:1.4;margin-bottom:.8rem;color:var(--text-main,#2b2b2b)">제주그래퍼 IR 피칭 자료</h1>
    <p style="color:var(--text-soft,#5b5b5b);line-height:1.75;margin-bottom:1.6rem">안내받은 비밀번호를 넣으면 내용이 열립니다.</p>
    <form id="lkf" autocomplete="off" style="display:flex;gap:.5rem;justify-content:center">
      <input id="lkp" type="password" inputmode="numeric" placeholder="비밀번호" aria-label="비밀번호" required
             style="flex:1;max-width:220px;padding:.75rem .9rem;border:1px solid var(--border-line,#d8d0c2);border-radius:9px;font:inherit">

  var u8=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})};
  async function open_(pw){
    var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(L.s),iterations:L.n,hash:"SHA-256"},k0,
                                        {name:"AES-GCM",length:256},false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(L.i)},k,u8(L.c)));
    var box=document.querySelector(".lockwrap");
    box.insertAdjacentHTML("beforebegin",html);
    box.remove();
    document.querySelectorAll("section script, header script, article script").forEach(function(old){
      var s=document.createElement("script");
      if(old.src)s.src=old.src; else s.textContent=old.textContent;
      old.replaceWith(s);
    });
    window.scrollTo(0,0);
    if(L.g){try{sessionStorage.setItem("jggate:"+L.g,pw)}catch(e){}}
  }
  document.getElementById("lkf").addEventListener("submit",async function(e){
    e.preventDefault();
    var m=document.getElementById("lkm"); m.textContent="여는 중…";
    try{ await open_(document.getElementById("lkp").value.trim()) }
    catch(err){ m.textContent="비밀번호가 맞지 않습니다."; }

  /* 같은 방문(sessionStorage) 안에서 한 번 연 그룹은 다시 묻지 않는다.
     포트폴리오 카드로 처음 들어와 한 번 열면, 허브↔기업 6쪽을 오갈 때 자동으로 열린다.
     탭을 닫으면 지워지고, 주소로 처음 들어오면 그때 한 번 묻는다. */
  try{
    if(L.g){
      var sp=sessionStorage.getItem("jggate:"+L.g);
      if(sp){
        document.getElementById("lkm").textContent="여는 중…";
        open_(sp).catch(function(){try{sessionStorage.removeItem("jggate:"+L.g)}catch(e){} document.getElementById("lkm").textContent="";});
      }
    }
  }catch(e){}
  /* 관리자 「바로 열기」 — 주소 뒤 #pw=... 로 들어오면 자동으로 연다.
     비밀번호를 아는 경우에만 통하고, # 뒤 값은 서버로 가지 않는다. 열고 나면 주소에서 지운다. */
  try{
    var hm=(location.hash||"").match(/[#&]pw=([^&]+)/);
    if(hm){
      history.replaceState(null,"",location.pathname+location.search);
      var pw=decodeURIComponent(hm[1]);
      document.getElementById("lkm").textContent="여는 중…";
      open_(pw).catch(function(){document.getElementById("lkm").textContent="비밀번호가 맞지 않습니다.";});
    }
  }catch(e){}
