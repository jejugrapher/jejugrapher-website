<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관덕정 3D 기록 — 제주그래퍼</title>
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1c2420; --muted:#5b655f; --line:#ddd6c6;
  --accent:#8a2f22; --accent-soft:#f3e2dc; --green:#1f6f5c; --green-soft:#dcebe5; --dark:#171a18; --gold:#c9a24a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  line-height:1.65;font-size:17px;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
a{color:var(--accent)}
img{max-width:100%;display:block}
h2{font-size:clamp(24px,3.6vw,34px);line-height:1.3;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-size:12.5px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:8px}
.lead{color:var(--muted);margin:0 0 26px;max-width:720px}
section{padding:60px 0}
section.alt{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* 첫 화면 */
.hero{position:relative;color:#fff;min-height:min(88vh,760px);display:flex;align-items:flex-end;background:#222 url(img/gw_front.jpg) center 40%/cover no-repeat}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72) 100%)}
.hero .wrap{position:relative;padding-bottom:44px;width:100%}
.hero .tag{display:inline-block;font-size:13px;letter-spacing:.06em;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:99px;margin-bottom:16px}
.hero h1{font-size:clamp(30px,6vw,58px);line-height:1.22;margin:0 0 12px;letter-spacing:-.025em;text-shadow:0 2px 18px rgba(0,0,0,.45);text-wrap:balance}
.hero p{font-size:clamp(16px,2.2vw,20px);margin:0;max-width:700px;color:#f1ede4;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px;max-width:760px}
.kpis div{background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 14px;backdrop-filter:blur(4px)}
.kpis b{display:block;font-size:clamp(20px,3.2vw,30px);line-height:1.15;font-variant-numeric:tabular-nums}
.kpis span{display:block;font-size:13px;color:#e3ddd0;margin-top:4px}

/* 영상 */
.vids{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.vid{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vid .fr{position:relative;aspect-ratio:16/9;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .b{padding:14px 16px 16px}
.vid h3{margin:0 0 4px;font-size:18px}
.vid p{margin:0;color:var(--muted);font-size:15px}

/* 사진 모음 */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gal figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:#ddd}
.gal img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3}
.gal figure.w2{grid-column:span 2;grid-row:span 2}
.gal figure.w2 img{aspect-ratio:auto}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:13.5px;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7))}
.gal figcaption b{font-size:15px}

/* 두 가지 3D */
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#000}
.card .b{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column}
.card h3{margin:0 0 6px;font-size:19px}
.card p{margin:0 0 12px;color:var(--muted);font-size:15.5px}
.card .go{margin-top:auto;font-weight:700;text-decoration:none;font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin-right:6px;vertical-align:2px}
.pill.now{background:var(--green-soft);color:var(--green)}
.pill.next{background:var(--accent-soft);color:var(--accent)}

/* 쓰임 */
.uses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.use{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.use img{width:100%;aspect-ratio:16/9;object-fit:cover}
.use .b{padding:14px 16px 16px}
.use h3{margin:0 0 4px;font-size:17.5px}
.use p{margin:0;font-size:15px;color:var(--muted)}

/* 비교 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.cmp>div{padding:20px 20px 22px}
.cmp>div+div{border-left:1px solid var(--line);background:#fbf6ef}
.cmp h3{margin:0 0 10px;font-size:17px}
.cmp ul{margin:0;padding-left:18px;color:var(--muted);font-size:15.5px}
.cmp li{margin:4px 0}
.note{font-size:13.5px;color:var(--muted);margin-top:12px}

/* 함께 */
.ask{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:n}
.ask div{background:var(--dark);color:#efe9dd;border-radius:14px;padding:20px 18px 22px;position:relative}
.ask div:before{counter-increment:n;content:counter(n);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1c1c1c;font-weight:800;margin-bottom:10px}
.ask h3{margin:0 0 6px;font-size:18px;color:#fff}
.ask p{margin:0;font-size:15px;color:#cfc8ba}
.cta{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.sign{margin-top:26px;font-size:15px;color:var(--muted)}
.sign b{color:var(--ink)}

/* 앞으로의 길 */
.road{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:0;align-items:stretch}
.stop{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.stop.first{border:2px solid var(--accent);box-shadow:0 6px 24px rgba(138,47,34,.12)}
.stop .ph{aspect-ratio:16/9;background:#2b2b2b;display:grid;place-items:center;color:#e9e2d2;font-size:15px;letter-spacing:.06em}
.stop .ph img{width:100%;height:100%;object-fit:cover}
.stop .b{padding:14px 16px 16px}
.stop .no{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.stop h3{margin:2px 0 4px;font-size:19px}
.stop p{margin:0;font-size:14.5px;color:var(--muted)}
.arrow{display:grid;place-items:center;padding:0 8px;color:var(--accent);font-size:26px;font-weight:800}
.why{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.why>div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px}
.why h3{margin:0 0 8px;font-size:17.5px}
.why ul{margin:0;padding-left:18px;font-size:15px;color:var(--muted)}
.why li{margin:5px 0}
.big{font-size:clamp(26px,4vw,38px);font-weight:800;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.ask .soft{display:block;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
@media (max-width:700px){
  .road{grid-template-columns:1fr}
  .why{grid-template-columns:1fr}
}

.src{font-size:13px;color:var(--muted);padding:28px 0 10px;border-top:1px solid var(--line)}
.src ol{padding-left:18px;margin:6px 0 0}
footer{padding:26px 0 40px;font-size:13px;color:var(--muted)}

@media (max-width:1000px){
  .road{grid-template-columns:1fr 1fr;gap:14px}
  .road .arrow{display:none}
}
@media (max-width:900px){
  .uses{grid-template-columns:1fr 1fr}
  .gal{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:700px){
  section{padding:44px 0}
  .vids,.two,.cmp,.ask,.road{grid-template-columns:1fr}
  .cmp>div+div{border-left:0;border-top:1px solid var(--line)}
  .uses{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .kpis div{padding:9px 9px}
  .kpis span{font-size:12px}
  .hero{min-height:82vh;background-position:center 35%}
}
</style>
</head>

  var u8=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})};
  async function open_(pw){
    var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(L.s),iterations:L.n,hash:"SHA-256"},k0,
                                        {name:"AES-GCM",length:256},false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(L.i)},k,u8(L.c)));
    var box=document.querySelector(".lockwrap");
    box.insertAdjacentHTML("beforebegin",html);
    box.remove();
    document.querySelectorAll("section script, header script, article script").forEach(function(old){
      var s=document.createElement("script");
      if(old.src)s.src=old.src; else s.textContent=old.textContent;
      old.replaceWith(s);
    });
    window.scrollTo(0,0);
    if(L.g){try{sessionStorage.setItem("jggate:"+L.g,pw)}catch(e){}}
  }
  document.getElementById("lkf").addEventListener("submit",async function(e){
    e.preventDefault();
    var m=document.getElementById("lkm"); m.textContent="여는 중…";
    try{ await open_(document.getElementById("lkp").value.trim()) }
    catch(err){ m.textContent="비밀번호가 맞지 않습니다."; }

  /* 같은 방문(sessionStorage) 안에서 한 번 연 그룹은 다시 묻지 않는다.
     포트폴리오 카드로 처음 들어와 한 번 열면, 허브↔기업 6쪽을 오갈 때 자동으로 열린다.

  try{
    if(L.g){
      var sp=sessionStorage.getItem("jggate:"+L.g);
      if(sp){
        document.getElementById("lkm").textContent="여는 중…";
        open_(sp).catch(function(){try{sessionStorage.removeItem("jggate:"+L.g)}catch(e){} document.getElementById("lkm").textContent="";});
      }
    }
  }catch(e){}
  /* 관리자 「바로 열기」 — 주소 뒤 #pw=... 로 들어오면 자동으로 연다.
     비밀번호를 아는 경우에만 통하고, # 뒤 값은 서버로 가지 않는다. 열고 나면 주소에서 지운다. */
  try{
    var hm=(location.hash||"").match(/[#&]pw=([^&]+)/);
    if(hm){
      history.replaceState(null,"",location.pathname+location.search);
      var pw=decodeURIComponent(hm[1]);
      document.getElementById("lkm").textContent="여는 중…";
      open_(pw).catch(function(){document.getElementById("lkm").textContent="비밀번호가 맞지 않습니다.";});
    }
  }catch(e){}
