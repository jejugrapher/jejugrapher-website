<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>제주맥주 양조장 디지털 트윈 · 포토존 프로젝션 매핑 (비공개) | JEJUGRAPHER</title>
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1c2420; --muted:#5d6861; --line:#ddd6c6;
  --accent:#1f6f5c; --accent-soft:#dcebe5; --warn:#b4552d; --warn-soft:#f6e3d8; --dark:#14201c;
  --beer:#e9a23b; --beer-soft:#fbeed3; --sea:#3fb6b2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  line-height:1.7;font-size:17px;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
a{color:var(--accent)}
img,video{max-width:100%;display:block}

.hero{background:var(--dark);color:#f3efe4;padding:72px 0 64px}
.tag{display:inline-block;font-size:13px;letter-spacing:.08em;border:1px solid #4d5d56;color:#b9c6bf;
  padding:3px 10px;border-radius:99px;margin-bottom:22px}
.hero h1{font-size:clamp(29px,5.2vw,48px);line-height:1.28;margin:0 0 20px;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--beer)}
.hero p{font-size:clamp(17px,2.2vw,20px);color:#cfd8d2;max-width:700px;margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
.facts div{border-top:1px solid #3a4a43;padding-top:14px}
.facts b{display:block;font-size:clamp(19px,2.8vw,25px);color:#fff}
.facts span{font-size:14px;color:#a9b7b0}

.steps{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.steps .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
.steps a{flex:none;text-decoration:none;color:var(--muted);font-size:14px;padding:6px 12px;border-radius:99px;white-space:nowrap}
.steps a:hover{background:var(--accent-soft);color:var(--accent)}

section{padding:64px 0;border-bottom:1px solid var(--line)}
.num{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.06em}
h2{font-size:clamp(25px,3.8vw,34px);line-height:1.3;margin:6px 0 16px;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:19px;margin:0 0 6px}
.lead{font-size:19px;color:var(--muted);max-width:720px;margin:0 0 28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.card p{margin:0;color:var(--muted);font-size:16px}
.card.good{background:var(--accent-soft);border:2px solid var(--accent)}
.card.good h3{color:var(--accent)}
.card.beer{background:var(--beer-soft);border-color:#ecd29b}
.card.beer h3{color:#8a5a0a}
ul.plain{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:16px}
ul.plain li{margin:4px 0}

figure{margin:0}
.diagram{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:22px}
.diagram svg{width:100%;height:auto;display:block}
figcaption{font-size:14px;color:var(--muted);margin-top:10px}
.shot{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shot img,.shot video{width:100%}
.shot figcaption{padding:12px 16px 14px;margin:0;border-top:1px solid var(--line)}
.shot figcaption b{color:var(--ink)}

/* 흐름 */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px;counter-reset:f}
.flow div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 16px;position:relative}
.flow div::before{counter-increment:f;content:counter(f);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:#fff;font-weight:700;font-size:15px;margin-bottom:10px}
.flow b{display:block;font-size:17px;margin-bottom:4px}
.flow span{font-size:15px;color:var(--muted)}
.flow .who{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin-top:10px}
.who.jg{background:var(--accent);color:#fff}
.who.tp{background:#3b4f8f;color:#fff}
.who.jb{background:var(--beer);color:#3a2500}

/* 포토존 장면 전환 (스크립트 없이) */
.scene input{position:absolute;opacity:0;pointer-events:none}
.scene .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.scene label{cursor:pointer;font-size:15px;font-weight:600;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.scene label:hover{border-color:var(--accent);color:var(--accent)}
#sc0:checked~.tabs label[for=sc0],#sc1:checked~.tabs label[for=sc1],#sc2:checked~.tabs label[for=sc2]{background:var(--accent);border-color:var(--accent);color:#fff}
#sc0:focus-visible~.tabs label[for=sc0],#sc1:focus-visible~.tabs label[for=sc1],#sc2:focus-visible~.tabs label[for=sc2]{outline:3px solid var(--beer);outline-offset:2px}
.scene .stage{background:#10161a;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.scene svg{width:100%;height:auto;display:block}
.scene .l1,.scene .l2,.scene .c0,.scene .c1,.scene .c2{display:none}
#sc1:checked~.stage .l1,#sc2:checked~.stage .l1,#sc2:checked~.stage .l2{display:block}
#sc0:checked~.caps .c0,#sc1:checked~.caps .c1,#sc2:checked~.caps .c2{display:block}
.scene .caps p{margin:14px 0 0;color:var(--muted)}
.scene .caps b{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .bub{animation:rise 5s linear infinite}
  .bub.b2{animation-duration:7s;animation-delay:-2s}.bub.b3{animation-duration:6s;animation-delay:-4s}
  @keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-150px);opacity:0}}
  .hop{animation:hop 1.6s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
}

.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:580px;font-size:16px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--muted);font-weight:600;background:#faf7ef}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}
.note{font-size:14px;color:var(--muted);margin-top:12px}
.callout{background:var(--dark);color:#f3efe4;border-radius:14px;padding:26px 28px;margin-top:26px;font-size:clamp(19px,2.6vw,24px);font-weight:700;line-height:1.5}
.callout em{font-style:normal;color:var(--beer)}
.callout small{display:block;font-size:15px;font-weight:400;color:#b9c6bf;margin-top:10px;line-height:1.7}
.pill{display:inline-block;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.use{display:flex;gap:14px;align-items:flex-start}
.use .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}

details{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 20px;margin:10px 0}
summary{cursor:pointer;padding:16px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:22px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0 0 18px;color:var(--muted)}

footer{padding:40px 0 60px;color:var(--muted);font-size:14px}
@media (max-width:720px){
  body{font-size:16px}
  .grid2,.grid3,.facts{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr 1fr}
  section{padding:48px 0}
  .hero{padding:52px 0 44px}
}
@media (max-width:420px){.flow{grid-template-columns:1fr}}

  var u8=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})};
  async function open_(pw){
    var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(L.s),iterations:L.n,hash:"SHA-256"},k0,
                                        {name:"AES-GCM",length:256},false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(L.i)},k,u8(L.c)));
    var box=document.querySelector(".lockwrap");
    box.insertAdjacentHTML("beforebegin",html);
    box.remove();
    document.querySelectorAll("section script, header script, article script").forEach(function(old){
      var s=document.createElement("script");
      if(old.src)s.src=old.src; else s.textContent=old.textContent;
      old.replaceWith(s);
    });
    window.scrollTo(0,0);
    if(L.g){try{sessionStorage.setItem("jggate:"+L.g,pw)}catch(e){}}
  }
  document.getElementById("lkf").addEventListener("submit",async function(e){
    e.preventDefault();
    var m=document.getElementById("lkm"); m.textContent="여는 중…";
    try{ await open_(document.getElementById("lkp").value.trim()) }
    catch(err){ m.textContent="비밀번호가 맞지 않습니다."; }

  /* 같은 방문(sessionStorage) 안에서 한 번 연 그룹은 다시 묻지 않는다.
     포트폴리오 카드로 처음 들어와 한 번 열면, 허브↔기업 6쪽을 오갈 때 자동으로 열린다.

  try{
    if(L.g){
      var sp=sessionStorage.getItem("jggate:"+L.g);
      if(sp){
        document.getElementById("lkm").textContent="여는 중…";
        open_(sp).catch(function(){try{sessionStorage.removeItem("jggate:"+L.g)}catch(e){} document.getElementById("lkm").textContent="";});
      }
    }
  }catch(e){}
  /* 관리자 「바로 열기」 — 주소 뒤 #pw=... 로 들어오면 자동으로 연다.
     비밀번호를 아는 경우에만 통하고, # 뒤 값은 서버로 가지 않는다. 열고 나면 주소에서 지운다. */
  try{
    var hm=(location.hash||"").match(/[#&]pw=([^&]+)/);
    if(hm){
      history.replaceState(null,"",location.pathname+location.search);
      var pw=decodeURIComponent(hm[1]);
      document.getElementById("lkm").textContent="여는 중…";
      open_(pw).catch(function(){document.getElementById("lkm").textContent="비밀번호가 맞지 않습니다.";});
    }
  }catch(e){}
