<style>
  :root{--bg:#F6F1E7;--bg-soft:#f4efe6;--panel:#fff;--line:#E3DCCE;--text-main:#1F2A37;--text-soft:#4b5563;--text-mute:#8C8578;--accent:#C97B5B;--navy:#1F3A5F;--gold:#B98B4E}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text-main);font:400 16px/1.75 'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
  .nav{position:sticky;top:0;z-index:20;background:rgba(246,241,231,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav .in{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center}
  .nav a{color:var(--text-soft);text-decoration:none;font-size:.92rem}
  .nav a.logo{font-weight:700;color:var(--navy)}
  main.plan{max-width:860px;margin:0 auto;padding:2.6rem 20px 4rem}
  .eyebrow{font-size:.74rem;letter-spacing:.2em;color:var(--text-mute);margin-bottom:.7rem}
  h1{font-family:'Noto Serif KR',serif;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.35;margin:0 0 .5rem}
  .sub{color:var(--text-soft);margin:0 0 2rem}
  .lede{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px;color:var(--text-soft);margin:0 0 2.4rem}
  section.blk{margin:0 0 2.2rem}
  section.blk > .tag{display:inline-block;font-size:.72rem;letter-spacing:.14em;color:#fff;background:var(--navy);border-radius:999px;padding:4px 11px;margin-bottom:.7rem}
  section.blk h2{font-family:'Noto Serif KR',serif;font-size:1.25rem;line-height:1.4;margin:.1rem 0 .6rem;color:var(--text-main)}
  section.blk p{margin:.4rem 0;color:var(--text-soft)}
  ul.pts{margin:.5rem 0 0;padding-left:1.1rem}
  ul.pts li{margin:.35rem 0;color:var(--text-soft)}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:.8rem 0 0}
  .cards .c{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
  .cards .c b{display:block;color:var(--navy);font-size:.95rem;margin-bottom:.2rem}
  .cards .c span{color:var(--text-soft);font-size:.9rem}
  .warn{background:#FBF3E8;border:1px solid #E7D3B3;border-radius:12px;padding:15px 17px;color:#6b5230;font-size:.95rem;margin:1rem 0 0}
  .warn b{color:#8a3b1e}
  footer{border-top:1px solid var(--line);background:#14110F;color:#CFC6B8;text-align:center;padding:22px 16px;font-size:.85rem}
  @media(max-width:620px){.cards{grid-template-columns:1fr}}
</style>
</head>

  async function open_(pw){
    var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(L.s),iterations:L.n,hash:"SHA-256"},k0,

      if(old.src)s.src=old.src; else s.textContent=old.textContent;
