<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>가이드오 — 제주 인사이트 트립</title>
<meta name="description" content="현장의 장면과 이야기로 제주 여행을 설계하고, 전문 가이드를 양성하는 브랜드">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F4EC;--panel:#fff;--line:#E3DCCE;--navy:#1F3A5F;--accent:#C97B5B;--ink:#2C2825;--mute:#8C8578;--soft:#FBF7EF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
a{color:var(--accent)}
.nav{position:sticky;top:0;z-index:20;background:rgba(248,244,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .in{max-width:1040px;margin:0 auto;padding:11px 20px;display:flex;gap:14px;align-items:center;font-size:.92rem}
.nav a{text-decoration:none;color:var(--navy);font-weight:700}
.nav .brand{font-weight:800;letter-spacing:.03em}
.navsep{color:var(--mute)}
.cta{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.74rem;letter-spacing:.2em;color:var(--mute);margin:0 0 .6rem;text-transform:uppercase}
h1{font-family:'Noto Serif KR',serif;font-size:clamp(1.7rem,4.6vw,2.5rem);line-height:1.3;margin:.2rem 0 .3rem;color:var(--navy)}
h2{font-family:'Noto Serif KR',serif;font-size:clamp(1.18rem,2.5vw,1.55rem);margin:0 0 .6rem;color:var(--ink)}
.ja{color:var(--mute);font-size:.86em;font-weight:400}
h2 .ja{font-weight:400;margin-left:.2rem;font-size:.66em}
.sub{color:#5b5349;margin:.2rem 0 0}
.hero{padding:2.6rem 0 1.4rem}
section.blk{padding:1.9rem 0;border-top:1px solid var(--line)}
.vid{position:relative;max-width:1000px;margin:1rem auto 0;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(44,40,37,.18);background:#15120f}
.vid.v916{aspect-ratio:9/16;max-width:360px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{position:relative;display:grid;place-items:center;text-align:center;color:#cbb;background:#15120f;min-height:100%}
.ph b{display:block;color:#e7d7c4;font-weight:700}.ph span{font-size:.85rem;color:#9a8f82}
.ph.poster{background-size:cover;background-position:center;color:#fff}
.ph.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(21,18,15,.10),rgba(21,18,15,.74))}
.phbadge{position:relative;z-index:1}
.phbadge b{display:block;color:#fff;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.phbadge span{font-size:.82rem;color:#eadfd0;text-shadow:0 1px 5px rgba(0,0,0,.6)}
/* hero banner image */
.herobanner{margin:.4rem 0 .2rem;border-radius:16px;overflow:hidden;box-shadow:0 16px 46px rgba(44,40,37,.18);aspect-ratio:16/7;background:#ece3d4 center/cover;position:relative}
.herobanner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(31,58,95,.16),transparent 55%)}
/* lead + about */
.lead{font-family:'Noto Serif KR',serif;font-size:clamp(1.1rem,2.1vw,1.3rem);line-height:1.6;color:var(--navy);margin:.2rem 0 .7rem}
.about{color:#4b443b;max-width:46rem}
.abouten{color:var(--mute);font-style:italic;margin:.5rem 0 0;font-family:'Noto Serif KR',serif}
.slogan{font-family:'Noto Serif KR',serif;color:var(--accent);font-size:1.12rem;font-weight:600;margin:.15rem 0 .4rem;line-height:1.5}
.slogan-ja{color:var(--mute);font-family:'Noto Serif KR',serif;font-weight:400;font-size:1rem;margin:-.3rem 0 .5rem}
/* info cards (business / products) */
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:1rem}
.ic{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:16px 18px;box-shadow:0 2px 10px rgba(44,40,37,.05)}
.ic h3{font-family:'Noto Serif KR',serif;font-size:1.08rem;margin:0 0 .35rem;color:var(--navy)}
.ic h3 .ja{font-size:.7em;margin-left:.25rem}
.ic p{margin:0;color:#4b443b;font-size:.94rem;line-height:1.66}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:1rem}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px 14px;text-align:center}
.stat b{display:block;font-family:'Noto Serif KR',serif;font-size:1.9rem;line-height:1;color:var(--accent)}
.stat span{display:block;margin-top:.4rem;color:#5b5349;font-size:.86rem}
.stat span .ja{display:inline;margin-left:.2rem}
/* timeline */
.tl{margin:1rem 0 0;padding:0;list-style:none;border-left:2px solid var(--line);margin-left:.4rem}
.tl li{position:relative;padding:.1rem 0 .95rem 1.3rem}
.tl li::before{content:"";position:absolute;left:-7px;top:.5rem;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.tl .yr{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--navy);margin-right:.5rem}
.tl .tx{color:#4b443b}
/* space block */
.space{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:1rem}
.space h3{font-family:'Noto Serif KR',serif;margin:0 0 .3rem;color:var(--navy);font-size:1.12rem}
.space p{margin:0;color:#4b443b}
/* pull quotes (philosophy) */
.pulls{margin:1rem 0 0;display:grid;gap:.6rem}
.pull{font-family:'Noto Serif KR',serif;font-size:1.06rem;color:var(--navy);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:.75rem 1.1rem;line-height:1.5}
.bigquote{font-family:'Noto Serif KR',serif;font-size:clamp(1.15rem,2.6vw,1.5rem);color:var(--navy);line-height:1.5;margin:.4rem 0;position:relative;padding-left:1.2rem;border-left:4px solid var(--accent)}
/* fact cards */
.factgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:1rem}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:#4b443b;font-size:.93rem;line-height:1.62;box-shadow:0 2px 8px rgba(44,40,37,.04)}
.fc .ja{display:block;margin-top:.3rem}
/* visit block */
.visit{background:linear-gradient(180deg,#fff,var(--soft));border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:1rem}
.visit p{margin:0;color:#4b443b}
.visit .vq{font-family:'Noto Serif KR',serif;font-size:1.14rem;color:var(--accent);margin:.7rem 0 0;line-height:1.5}
/* key-value + links */
.kv{display:grid;grid-template-columns:8.6rem 1fr;gap:.3rem .8rem;margin:.4rem 0 0;font-size:.95rem}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.kv dt .ja{margin-left:.15rem}
.links{margin-top:.9rem;display:flex;flex-wrap:wrap;gap:.5rem}
.links a{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 15px;text-decoration:none;color:var(--navy);font-weight:600;font-size:.9rem}
.links a:hover{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;padding:11px 20px;border-radius:999px;margin:.3rem .4rem 0 0}
.btn.alt{background:var(--panel);color:var(--navy);border:1px solid var(--line)}
.note{background:#FBF3E8;border:1px solid #E7D3B3;border-radius:12px;padding:13px 16px;color:#6b5230;font-size:.92rem;margin:1rem 0 0}
.meta{color:var(--mute);font-size:.86rem}
.usage{color:#6b6459;font-size:.9rem;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-top:.6rem}
footer{border-top:1px solid var(--line);background:#15120f;color:#cfc6b8;padding:24px 16px;font-size:.84rem;line-height:1.7;text-align:center}
footer b{color:#f3d9a4}
/* hub: days / timeline cards / dialogue */
.overview{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:1rem}
.overview .kv{grid-template-columns:7rem 1fr}
.overview p{margin:.7rem 0 0;color:#4b443b}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:1rem 0 .6rem}
.dayc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dayposter{aspect-ratio:3/4;background:#ece3d4 center/cover}
.dmeta{padding:11px 13px 14px}
.dmeta b{display:block;color:var(--navy);font-size:.9rem}
.dmeta .dtitle{display:block;font-weight:700;letter-spacing:.02em;font-size:.8rem;color:var(--accent);margin:.22rem 0 .15rem}
.dmeta .ddesc{display:block;color:#5b5349;font-size:.84rem;line-height:1.55}
.quote{margin:.9rem 0 0;padding:.5rem 0 .5rem 1rem;border-left:3px solid var(--accent);color:#5b5349;font-style:italic}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:1rem}
.pc{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .16s,border-color .16s;box-shadow:0 2px 10px rgba(44,40,37,.05)}
.pc:hover{transform:translateY(-3px);border-color:var(--accent)}
.pc .im{aspect-ratio:16/9;background:#ece3d4 center/cover;position:relative}
.pc .when{position:absolute;top:10px;left:10px;background:rgba(31,58,95,.92);color:#fff;font:700 12px/1 'IBM Plex Sans KR';padding:5px 9px;border-radius:999px}
.pc .bd{padding:14px 16px 16px}
.pc h3{font-family:'Noto Serif KR',serif;font-size:1.1rem;margin:0 0 .1rem;color:var(--navy)}
.pc .one{color:#5b5349;font-size:.9rem;line-height:1.6;margin:.4rem 0 .5rem}
.pc .go{color:var(--accent);font-weight:700;font-size:.88rem}
.dlg{margin:.6rem 0 .9rem;display:flex;flex-direction:column;gap:.5rem}
.dlg p{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:.7rem 1rem;color:#4b443b;max-width:82%;line-height:1.6}
.dlg p:nth-child(even){align-self:flex-end;background:#F1E7D8}
.center{text-align:center}
.who{color:var(--mute);font-size:.9rem;margin:.6rem 0 0}
@media(max-width:620px){.cards{grid-template-columns:1fr}.kv{grid-template-columns:7rem 1fr}.days{grid-template-columns:1fr}.icards{grid-template-columns:1fr}.factgrid{grid-template-columns:1fr}.dlg p{max-width:92%}}
</style>
