<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>가이드오 — 제주 인사이트 트립</title>
<meta name="description" content="현장의 장면과 이야기로 제주 여행을 설계하고, 전문 가이드를 양성하는 브랜드">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F4EC;--panel:#fff;--line:#E3DCCE;--navy:#1F3A5F;--accent:#C97B5B;--ink:#2C2825;--mute:#8C8578}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
a{color:var(--accent)}
.nav{position:sticky;top:0;z-index:20;background:rgba(248,244,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .in{max-width:1040px;margin:0 auto;padding:11px 20px;display:flex;gap:14px;align-items:center;font-size:.92rem}
.nav a{text-decoration:none;color:var(--navy);font-weight:700}
.nav .brand{font-weight:800;letter-spacing:.03em}
.navsep{color:var(--mute)}
.cta{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.74rem;letter-spacing:.2em;color:var(--mute);margin:0 0 .6rem}
h1{font-family:'Noto Serif KR',serif;font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.34;margin:.2rem 0 .3rem;color:var(--navy)}
h2{font-family:'Noto Serif KR',serif;font-size:clamp(1.15rem,2.4vw,1.5rem);margin:0 0 .5rem;color:var(--ink)}
.ja{color:var(--mute);font-size:.86em;font-weight:400}
.sub{color:#5b5349;margin:.2rem 0 0}
.hero{padding:2.4rem 0 1.2rem}
section.blk{padding:1.6rem 0;border-top:1px solid var(--line)}
.vid{position:relative;max-width:1000px;margin:1rem auto 0;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(44,40,37,.18);background:#15120f}
.vid.v916{aspect-ratio:9/16;max-width:360px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{position:relative;display:grid;place-items:center;text-align:center;color:#cbb;background:#15120f;min-height:100%}
.ph b{display:block;color:#e7d7c4;font-weight:700}.ph span{font-size:.85rem;color:#9a8f82}
.ph.poster{background-size:cover;background-position:center;color:#fff}
.ph.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(21,18,15,.10),rgba(21,18,15,.74))}
.phbadge{position:relative;z-index:1}
.phbadge b{display:block;color:#fff;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.phbadge span{font-size:.82rem;color:#eadfd0;text-shadow:0 1px 5px rgba(0,0,0,.6)}
h2 .ja{font-weight:400;margin-left:.15rem}
.kv dt .ja{margin-left:.15rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:1rem}
.pc{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .16s,border-color .16s;box-shadow:0 2px 10px rgba(44,40,37,.05)}
.pc:hover{transform:translateY(-3px);border-color:var(--accent)}
.pc .im{aspect-ratio:16/9;background:#ece3d4 center/cover;position:relative;display:grid;place-items:center;color:#b6a890}
.pc .tag{position:absolute;top:10px;left:10px;background:rgba(31,58,95,.92);color:#fff;font:600 11px/1 'IBM Plex Sans KR';letter-spacing:.02em;padding:5px 9px;border-radius:999px}
.pc .num{position:absolute;top:10px;right:10px;background:rgba(201,123,91,.95);color:#fff;font:700 12px/1;padding:5px 9px;border-radius:999px}
.pc .bd{padding:14px 16px 16px}
.pc h3{font-family:'Noto Serif KR',serif;font-size:1.1rem;margin:0 0 .1rem;color:var(--navy)}
.pc .one{color:#5b5349;font-size:.9rem;line-height:1.6;margin:.4rem 0 .5rem}
.pc .slg{color:var(--accent);font-weight:600;font-size:.9rem;margin:.15rem 0 .2rem}
.slogan{font-family:'Noto Serif KR',serif;color:var(--accent);font-size:1.08rem;font-weight:600;margin:.15rem 0 .5rem;line-height:1.5}
.heroimg img{width:100%;border-radius:14px;display:block;margin:.6rem 0 .2rem;box-shadow:0 14px 40px rgba(44,40,37,.16)}
.slogan-ja{color:var(--mute);font-family:'Noto Serif KR',serif;font-weight:400;font-size:.98rem;margin:-.35rem 0 .5rem}
.slg-ja{color:var(--mute);font-weight:500;font-size:.82rem;margin:-.05rem 0 .25rem}
.slogan-alt{color:#8a8276;font-size:.92rem;margin:-.25rem 0 .5rem;font-style:italic}
.pc .go{color:var(--accent);font-weight:700;font-size:.88rem}
.kv{display:grid;grid-template-columns:8.6rem 1fr;gap:.25rem .8rem;margin:.6rem 0 0;font-size:.95rem}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.facts{margin:.8rem 0 0;padding-left:1.1rem}.facts li{margin:.35rem 0;color:#4b443b}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;padding:11px 20px;border-radius:999px;margin:.3rem .4rem 0 0}
.btn.alt{background:var(--panel);color:var(--navy);border:1px solid var(--line)}
.btn.off{background:#efe7d8;color:#998e7e;pointer-events:none}
.note{background:#FBF3E8;border:1px solid #E7D3B3;border-radius:12px;padding:13px 16px;color:#6b5230;font-size:.92rem;margin:1rem 0 0}
.meta{color:var(--mute);font-size:.86rem}
footer{border-top:1px solid var(--line);background:#15120f;color:#cfc6b8;padding:22px 16px;font-size:.84rem;line-height:1.7;text-align:center}
footer b{color:#f3d9a4}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:1rem 0 .6rem}
.dayc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dayposter{aspect-ratio:3/4;background:#ece3d4 center/cover}
.dmeta{padding:11px 13px 14px}
.dmeta b{display:block;color:var(--navy);font-size:.9rem}
.dmeta .dtitle{display:block;font-weight:700;letter-spacing:.02em;font-size:.8rem;color:var(--accent);margin:.22rem 0 .15rem}
.dmeta .ddesc{display:block;color:#5b5349;font-size:.84rem;line-height:1.55}
.quote{margin:.9rem 0 0;padding:.5rem 0 .5rem 1rem;border-left:3px solid var(--accent);color:#5b5349;font-style:italic}
.pc .when{position:absolute;top:10px;left:10px;background:rgba(31,58,95,.92);color:#fff;font:700 12px/1 'IBM Plex Sans KR';padding:5px 9px;border-radius:999px}
.dlg{margin:.6rem 0 .9rem;display:flex;flex-direction:column;gap:.5rem}
.dlg p{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:.7rem 1rem;color:#4b443b;max-width:82%;line-height:1.6}
.dlg p:nth-child(even){align-self:flex-end;background:#F1E7D8}
.center{text-align:center}
.who{color:var(--mute);font-size:.9rem;margin:.6rem 0 0}
@media(max-width:620px){.cards{grid-template-columns:1fr}.kv{grid-template-columns:7rem 1fr}.days{grid-template-columns:1fr 1fr}.dlg p{max-width:92%}}
</style></head><body>

    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(L.s),iterations:L.n,hash:"SHA-256"},k0,
                                        {name:"AES-GCM",length:256},false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(L.i)},k,u8(L.c)));
    var box=document.querySelector(".lockwrap");
    box.insertAdjacentHTML("beforebegin",html);
    box.remove();
    document.querySelectorAll("section script, header script, article script").forEach(function(old){
      var s=document.createElement("script");
      if(old.src)s.src=old.src; else s.textContent=old.textContent;
      old.replaceWith(s);
    });
    window.scrollTo(0,0);
    if(L.g){try{sessionStorage.setItem("jggate:"+L.g,pw)}catch(e){}}
  }
  document.getElementById("lkf").addEventListener("submit",async function(e){
    e.preventDefault();
    var m=document.getElementById("lkm"); m.textContent="여는 중…";
    try{ await open_(document.getElementById("lkp").value.trim()) }
    catch(err){ m.textContent="비밀번호가 맞지 않습니다."; }
  });
  /* 같은 방문(sessionStorage) 안에서 한 번 연 그룹은 다시 묻지 않는다.
     포트폴리오 카드로 처음 들어와 한 번 열면, 허브↔기업 6쪽을 오갈 때 자동으로 열린다.
     탭을 닫으면 지워지고, 주소로 처음 들어오면 그때 한 번 묻는다. */
  try{
    if(L.g){
      var sp=sessionStorage.getItem("jggate:"+L.g);
      if(sp){
        document.getElementById("lkm").textContent="여는 중…";
        open_(sp).catch(function(){try{sessionStorage.removeItem("jggate:"+L.g)}catch(e){} document.getElementById("lkm").textContent="";});
      }
    }
  }catch(e){}
  /* 관리자 「바로 열기」 — 주소 뒤 #pw=... 로 들어오면 자동으로 연다.
     비밀번호를 아는 경우에만 통하고, # 뒤 값은 서버로 가지 않는다. 열고 나면 주소에서 지운다. */
  try{
    var hm=(location.hash||"").match(/[#&]pw=([^&]+)/);
    if(hm){
      history.replaceState(null,"",location.pathname+location.search);
      var pw=decodeURIComponent(hm[1]);
      document.getElementById("lkm").textContent="여는 중…";
      open_(pw).catch(function(){document.getElementById("lkm").textContent="비밀번호가 맞지 않습니다.";});
    }
  }catch(e){}
})();
</script>
